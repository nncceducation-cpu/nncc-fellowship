<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People & Enrollments, Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css?v=6d84165">
<link rel="stylesheet" href="portal-mobile.css">
<script src="app-boot.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tabs button{background:none;border:0;padding:12px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--navy);border-bottom-color:var(--teal)}
  .chip-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px}
  .chip-btn:hover{border-color:var(--teal);color:var(--teal-600)}
  .checklist{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
  .checklist label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px}
  .checklist label:hover{background:var(--bg-soft)}
  .compact-picker{position:relative;max-width:560px}
  .compact-picker>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);font-weight:650;cursor:pointer}
  .compact-picker>summary::-webkit-details-marker{display:none}.compact-picker>summary:after{content:'▾';color:var(--muted)}
  .compact-picker[open]>summary{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,138,138,.12)}
  .compact-picker-panel{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(560px,calc(100vw - 48px));padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 16px 36px rgba(12,42,77,.18)}
  .compact-picker-panel .picker-search{width:100%;margin-bottom:8px}.compact-picker-panel .checklist{border:0;padding:0;max-height:250px}
  #en-course{width:min(100%,480px)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:620px){.row2{grid-template-columns:1fr}}
  .people-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .people-subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-weight:650;color:var(--muted);cursor:pointer}
  .people-subtabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .directory-tools{display:grid;grid-template-columns:minmax(240px,1fr) 170px 170px auto;gap:10px;align-items:end;margin:14px 0}
  .directory-tools .field{margin:0}.directory-tools input,.directory-tools select{min-height:42px}
  .bulk-bar{display:none;align-items:center;gap:9px;flex-wrap:wrap;background:#eef8f8;border:1px solid #b9dddd;border-radius:12px;padding:10px 12px;margin:12px 0;position:sticky;top:8px;z-index:5;box-shadow:0 8px 24px rgba(12,42,77,.08)}
  .bulk-bar.show{display:flex}.bulk-bar strong{margin-right:auto;color:var(--navy)}
  .bulk-group{display:flex;gap:6px;align-items:center}.bulk-group select{width:auto;min-width:150px;padding:7px 30px 7px 9px}
  .member-check{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
  .members-table-wrap{overflow:visible}.members-table-wrap .tbl{min-width:790px}
  .member-action-cell{width:1%;white-space:nowrap;overflow:visible}
  .member-actions{position:relative;display:inline-block}
  .member-actions summary{list-style:none;cursor:pointer;min-width:96px;padding:7px 30px 7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);font-size:13px;font-weight:600;position:relative;user-select:none}
  .member-actions summary::-webkit-details-marker{display:none}
  .member-actions summary::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-52%);font-size:12px;color:var(--muted)}
  .member-actions[open] summary{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,138,138,.12)}
  .member-actions-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:30;display:grid;min-width:178px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 28px rgba(17,40,64,.16)}
  .members-table-wrap tbody tr:nth-last-child(-n+2) .member-actions-menu{top:auto;bottom:calc(100% + 5px)}
  .row-actions .member-actions-menu button{width:100%;margin:0;padding:9px 10px;border:0;background:transparent;text-align:left;font-size:13px;border-radius:7px;white-space:nowrap}
  .row-actions .member-actions-menu button:hover{background:var(--navy-50);color:var(--teal-600)}
  .row-actions .member-actions-menu button:disabled{opacity:.45;cursor:not-allowed}
  .member-row.is-selected{background:#f0f8ff}
  .message-dialog{width:min(620px,calc(100vw - 28px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px rgba(12,42,77,.28)}
  .message-dialog::backdrop{background:rgba(8,31,55,.52)}
  .message-dialog-inner{padding:22px}.message-dialog-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
  .message-dialog-head h2{margin:0}.message-dialog-close{border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted)}
  .message-dialog textarea{width:100%;min-height:190px;resize:vertical}.message-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  @media(max-width:820px){.directory-tools{grid-template-columns:1fr 1fr}.directory-tools .search-field{grid-column:1/-1}.members-table-wrap{overflow-x:auto;overflow-y:visible}}
  @media(max-width:560px){.directory-tools{grid-template-columns:1fr}.directory-tools .search-field{grid-column:auto}.bulk-bar{position:static}.bulk-group{width:100%}.bulk-group select{flex:1}}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="portal.html">
      <img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
      <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>People &amp; Enrollments</span></span>
    </a>
    <nav class="nav">
      <a href="portal.html">Portal</a>
      <a href="authoring.html">Builder</a>
      <a href="people.html" class="active">People</a>
      <span class="user-chip" id="user-chip"></span>
    </nav>
  </div>
</header>

<main class="portal-wrap">
  <div class="container">
    <div class="p-head" style="margin-bottom:16px"><h1>People &amp; Enrollments</h1>
      <p>Manage members, enrollments (with expiry), groups and email, the admin control centre.</p></div>
    <div id="msg"></div>
    <dialog id="message-dialog" class="message-dialog"></dialog>
    <div class="tabs">
      <button data-tab="members" class="active">All users</button>
      <button data-tab="enroll">Enrollments &amp; progress</button>
      <button data-tab="groups">Groups</button>
      <button data-tab="email">Notification emails</button>
    </div>
    <div id="tab-members"></div>
    <div id="tab-enroll" style="display:none"></div>
    <div id="tab-groups" style="display:none"></div>
    <div id="tab-email" style="display:none"></div>
  </div>
</main>

<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="countries.js"></script>
<script src="portal-auth.js"></script>
<script src="portal-shell.js"></script>
<script>
(async function () {
  const me = await NNCC.requireAdmin(); if(!me) return;
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb = NNCC.client;
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const flash=(t,k)=>{ $("#msg").innerHTML=t?`<div class="msg ${k||'ok'}">${t}</div>`:""; if(t) setTimeout(()=>$("#msg").innerHTML="",4000); };
  const fmtDate=(d)=> d? new Date(d).toLocaleDateString() : "-";
  const toIso=(v)=> v? new Date(v+"T23:59:59").toISOString() : null;
  // ---- portal access levels ----
  const ACCESS=[["modules","Modules + My Certificates"],["forum","Forum"],["resources","Private resources"],["directory","Member directory"]];
  const accessBoxes=(prefix,cur={modules:true})=>`<div class="field" style="grid-column:1/-1"><label>Portal access</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:4px">${ACCESS.map(([k,l])=>
        `<label style="display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;color:var(--ink)"><input type="checkbox" id="${prefix}-${k}" ${cur[k]?'checked':''}> ${l}</label>`).join("")}</div></div>`;
  const readBoxes=(prefix)=>({ modules:!!$("#"+prefix+"-modules")?.checked, forum:!!$("#"+prefix+"-forum")?.checked, resources:!!$("#"+prefix+"-resources")?.checked, directory:!!$("#"+prefix+"-directory")?.checked });
  const setAccess=(email,uid,b,inst,country,profession)=> sb.rpc("admin_set_access",{p_user:uid||null,p_email:email||null,p_modules:b.modules,p_forum:b.forum,p_resources:b.resources,p_directory:b.directory,p_institution:(inst===undefined?null:inst),p_country:(country===undefined||country===''?null:country),p_profession:(profession===undefined||profession===''?null:profession)});
  const cpFields=(prefix)=>`<div class="field"><label>Country</label><select id="${prefix}-country"></select></div>
      <div class="field"><label>Profession</label><select id="${prefix}-prof"></select></div>`;
  const fillCP=(prefix,country,prof)=>{ if(window.fillCountrySelect){ fillCountrySelect($("#"+prefix+"-country"),country||""); fillProfessionSelect($("#"+prefix+"-prof"),prof||""); } };
  function downloadCSV(filename, rows){
    const csv=rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=filename; a.click();
  }

  let S={ members:[], courses:[], groups:[] };
  let selectedMembers=new Set(), pendingEmailIds=[], pendingEnrollIds=[];
  const selectedPeople=()=>S.members.filter(m=>selectedMembers.has(m.id));
  const selectedIds=()=>selectedPeople().map(m=>m.id);
  const selectionBanner=(area)=>{
    const people=selectedPeople(); if(!people.length)return "";
    const label=people.length===1?(people[0].full_name||people[0].email):`${people.length} selected members`;
    const detail=people.length===1?people[0].email:"Only the selected members are shown below.";
    return `<section class="panel" style="padding:14px 18px;border-color:#8bc9c8;background:#f1fbfa"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><span class="small-link">Selected member context · ${esc(area)}</span><h2 style="margin:2px 0 0;font-size:1.15rem">${esc(label)}</h2>${detail&&detail!==label?`<span class="small-link">${esc(detail)}</span>`:""}</div><button class="chip-btn" data-clear-member-context>Show all members</button></div></section>`;
  };
  const bindSelectionBanner=()=>document.querySelectorAll("[data-clear-member-context]").forEach(b=>b.addEventListener("click",()=>{selectedMembers.clear();activateMainTab("members");}));
  async function loadCore(){
    const [{data:m},{data:c},{data:g}] = await Promise.all([
      sb.from("members_overview").select("*").order("created_at"),
      sb.from("courses").select("*").order("sort_order"),
      sb.from("groups").select("*").order("name"),
    ]);
    S.members=m||[]; S.courses=c||[]; S.groups=g||[];
  }

  // ---------- tabs ----------
  async function activateMainTab(tab){
    const b=document.querySelector(`.tabs button[data-tab="${tab}"]`);
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));
    ["members","enroll","groups","email"].forEach(t=>$("#tab-"+t).style.display = t===tab?"block":"none");
    await render(tab);
  }
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>activateMainTab(b.dataset.tab)));
  async function render(tab){
    await loadCore();
    if(tab==="members") renderMembers();
    if(tab==="enroll") renderEnroll();
    if(tab==="groups") renderGroups();
    if(tab==="email") renderEmail();
  }

  // ================= MEMBERS =================
  function renderMembers(){
    selectedMembers=new Set([...selectedMembers].filter(id=>S.members.some(m=>m.id===id)));
    const rows=S.members.map(m=>`<tr class="member-row${selectedMembers.has(m.id)?' is-selected':''}" data-member-row data-id="${m.id}" data-role="${esc(m.role||'member')}" data-status="${esc(m.status||'active')}" data-search="${esc(((m.full_name||'')+' '+(m.email||'')).toLowerCase())}">
      <td><input class="member-check member-row-check" type="checkbox" value="${m.id}" aria-label="Select ${esc(m.full_name||m.email||'member')}" ${selectedMembers.has(m.id)?'checked':''}></td>
      <td><a href="#" data-open="${m.id}" style="color:var(--brand,#144e8c);font-weight:600;text-decoration:none">${esc(m.full_name||'-')}</a></td>
      <td><a href="#" data-open="${m.id}" style="color:var(--brand,#144e8c);text-decoration:none">${esc(m.email||'')}</a></td>
      <td><span class="badge ${m.role}">${m.role}</span> ${m.status==='suspended'?'<span class="badge" style="background:#fdecec;color:#8a1f1f">suspended</span>':''}</td>
      <td>${m.enrollments}</td><td>${m.lessons_done}</td>
      <td class="row-actions member-action-cell">
        <details class="member-actions">
          <summary aria-label="Actions for ${esc(m.full_name||m.email||'member')}">Actions</summary>
          <div class="member-actions-menu">
            <button data-detail="${m.id}">Open profile</button>
            <button data-signin="${m.id}" data-e="${esc(m.email||'')}">🔑 Sign-in link</button>
            <button data-msg="${m.id}" data-e="${esc(m.email||'')}" data-n="${esc(m.full_name||'')}">✉ Message</button>
            ${m.role==='admin'?`<button data-demote="${m.id}" ${m.id===me.id?'disabled':''}>Make member</button>`:`<button data-promote="${m.id}">Make admin</button>`}
            ${m.status==='active'?`<button data-suspend="${m.id}" ${m.id===me.id?'disabled':''}>Suspend</button>`:`<button data-activate="${m.id}">Reactivate</button>`}
            ${m.id===me.id?'':`<button data-del="${m.id}">Remove</button>`}
          </div>
        </details>
      </td></tr>`).join("");
    $("#tab-members").innerHTML=`<nav class="people-subtabs" aria-label="People tools">
        <button class="active" data-people-view="directory">All users</button>
        <button data-people-view="requests">Join requests</button>
        <button data-people-view="add">Add or invite</button>
        <button data-people-view="import">Import users</button>
      </nav>
      <div data-people-panel="directory">
      <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="margin-bottom:3px">All users (${S.members.length})</h2><p class="sub" style="margin:0">Search, select and manage members from one place.</p></div>
        <button class="chip-btn" id="exp-members">⬇ Export all</button></div>
        <div class="directory-tools">
          <div class="field search-field"><label for="member-search">Search</label><input id="member-search" type="search" placeholder="Search by name or email"></div>
          <div class="field"><label for="member-role">Role</label><select id="member-role"><option value="">All roles</option><option value="member">Members</option><option value="admin">Admins</option></select></div>
          <div class="field"><label for="member-status">Status</label><select id="member-status"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div>
          <button class="chip-btn" id="select-visible" style="min-height:42px">Select visible</button>
        </div>
        <div class="bulk-bar" id="member-bulk" aria-live="polite">
          <strong id="member-selected-count">0 selected</strong>
          <button class="chip-btn" data-bulk-email>✉ Email</button>
          <button class="chip-btn" data-bulk-enroll>＋ Enroll</button>
          <div class="bulk-group"><select id="bulk-group"><option value="">Add to group…</option>${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button class="chip-btn" data-bulk-group>Add</button></div>
          <button class="chip-btn" data-bulk-activate>Reactivate</button>
          <button class="chip-btn" data-bulk-suspend>Suspend</button>
          <button class="chip-btn" data-bulk-export>⬇ Export</button>
          <button class="chip-btn" data-bulk-clear>Clear</button>
        </div>
        <div class="members-table-wrap"><table class="tbl"><thead><tr><th><input class="member-check" id="member-check-all" type="checkbox" aria-label="Select all visible users"></th><th>Name</th><th>Email</th><th>Role</th><th>Enrollments</th><th>Lessons done</th><th>Actions</th></tr></thead>
        <tbody id="members-body">${rows}</tbody></table></div><p class="muted-note" id="member-result-count"></p></section>
      </div>
      <div data-people-panel="requests" style="display:none"><section class="panel" id="jr-panel"><h2>Requests to join</h2>
        <p class="sub">People who asked to join from the sign-in page. Invite or add them, or dismiss.</p>
        <div id="jr-list" class="muted-note">Loading…</div></section></div>
      <div data-people-panel="add" style="display:none"><section class="panel"><h2>Add a member</h2>
        <p class="sub">Creates the account immediately. Set a password (they can sign in right away) or leave it blank to auto-generate one you can share. No email is required.</p>
        <div id="add-msg"></div>
        <div class="inline-form">
          <div class="field"><label>Full name</label><input id="am-name" placeholder="Dr. Jane Smith"></div>
          <div class="field"><label>Email</label><input id="am-email" type="email" placeholder="jane@example.com"></div>
          <div class="field"><label>Password (optional)</label><input id="am-pass" placeholder="blank = auto-generate"></div>
          ${cpFields("am")}
          ${accessBoxes("am")}
          <div class="field" style="grid-column:1/-1"><label>Enroll in module(s)</label>
            <details class="compact-picker" data-picker><summary><span data-picker-label>Select modules (0)</span></summary><div class="compact-picker-panel"><input class="picker-search" type="search" placeholder="Search modules" aria-label="Search modules"><div class="checklist" id="am-courses">${S.courses.map(c=>`<label data-picker-option><input type="checkbox" class="am-course" value="${c.id}"> ${esc(c.title)}</label>`).join("")||'<span class="small-link">No modules are available.</span>'}</div></div></details></div>
          <div class="field" style="grid-column:1/-1"><label>Add to group(s)</label>
            <details class="compact-picker" data-picker><summary><span data-picker-label>Select groups (0)</span></summary><div class="compact-picker-panel"><input class="picker-search" type="search" placeholder="Search groups" aria-label="Search groups"><div class="checklist" id="am-groups">${S.groups.map(g=>`<label data-picker-option><input type="checkbox" class="am-group" value="${g.id}"> ${esc(g.name)}</label>`).join("")||'<span class="small-link">No groups have been created.</span>'}</div></div></details></div>
          <div class="field"><label>Course access starts</label><input id="am-start" type="date"></div>
          <div class="field"><label>Course access expires (optional)</label><input id="am-expiry" type="date"></div>
          <div class="field" style="grid-column:1/-1"><label style="font-weight:500"><input type="checkbox" id="am-welcome" checked> Send a welcome email (sign-in link + instructions, from Dr. Khorshid Mohammad)</label></div>
          <button class="btn" id="am-go">Add member</button>
        </div>
      </section>
      <section class="panel"><h2>Invite members by email</h2>
        <p class="sub">Sends an email invite so each person sets their own password. One per line as <b>Full Name, email</b>. The access levels below apply to everyone in this batch.</p>
        <div id="inv-msg"></div>
        <textarea id="bulk" rows="4" class="" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px" placeholder="Dr. Jane Smith, jane@example.com&#10;Dr. Omar Ali, omar@example.com"></textarea>
        <div class="inline-form" style="margin-top:10px">${accessBoxes("inv")}</div>
        <button class="btn" id="bulk-go" style="margin-top:10px">Send invites</button>
      </section></div>
      <div data-people-panel="import" style="display:none"><section class="panel"><h2>Import users from a file (bulk)</h2>
        <p class="sub">Upload a spreadsheet (CSV) with columns <b>Email, First Name, Last Name</b> and optionally a "modules interested" column. We create each account and can enrol everyone in the courses you choose. <a href="#" id="imp-tpl" class="small-link">Download the template</a>.</p>
        <div id="imp-msg"></div>
        <input type="file" id="imp-file" accept=".csv,.tsv,.txt">
        <div id="imp-preview" style="margin-top:12px"></div>
        <div id="imp-opts" style="display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
          <div class="field" style="max-width:420px"><label>How to create accounts</label>
            <select id="imp-mode"><option value="create">Create accounts with auto-generated passwords</option>
              <option value="invite">Send email invites (each person sets their own password)</option></select></div>
          <div class="inline-form" style="margin-top:6px">${accessBoxes("imp")}</div>
          <div class="field" style="margin-top:8px"><label>Also enrol every imported user in these courses</label>
            <div class="checklist" id="imp-courses"></div></div>
          <label style="display:block;margin-top:8px;font-size:13.5px;font-weight:500"><input type="checkbox" id="imp-auto"> Also try to auto-enrol from the "modules interested" column (matched to course titles)</label>
          <label style="display:block;margin-top:8px;font-size:13.5px;font-weight:500"><input type="checkbox" id="imp-welcome" checked> Email each new member a welcome message with a sign-in link (from Dr. Khorshid Mohammad)</label>
          <button class="btn" id="imp-go" style="margin-top:12px">Import users</button>
        </div>
      </section></div>`;
    const setPeopleView=view=>{
      document.querySelectorAll("[data-people-view]").forEach(b=>b.classList.toggle("active",b.dataset.peopleView===view));
      document.querySelectorAll("[data-people-panel]").forEach(p=>p.style.display=p.dataset.peoplePanel===view?"block":"none");
      if(view==='requests') loadJoinRequests();
    };
    document.querySelectorAll("[data-people-view]").forEach(b=>b.addEventListener("click",()=>setPeopleView(b.dataset.peopleView)));
    $("#bulk-go").addEventListener("click", bulkInvite);
    $("#am-go").addEventListener("click", addMemberDirect);
    fillCP("am");
    setupCompactPickers();

  // ---------- Bulk CSV import ----------
  function parseCSV(text){
    text=String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    const first=text.split("\n")[0]||""; const delim=(first.indexOf("\t")>=0 && first.indexOf(",")<0)?"\t":",";
    const rows=[]; let i=0, field="", row=[], inq=false;
    while(i<text.length){ const c=text[i];
      if(inq){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inq=false;i++;continue;} field+=c;i++;continue; }
      if(c==='"'){ inq=true;i++;continue; }
      if(c===delim){ row.push(field);field="";i++;continue; }
      if(c==="\n"){ row.push(field);field="";rows.push(row);row=[];i++;continue; }
      field+=c;i++; }
    if(field.length||row.length){ row.push(field); rows.push(row); }
    if(!rows.length) return {records:[]};
    const headers=rows[0].map(h=>String(h||"").trim());
    const col=(...keys)=>headers.findIndex(h=>keys.some(k=>h.toLowerCase().includes(k)));
    const ei=col("email"), fi=col("first"), li=col("last"), ni=col("full name","name"), mi=col("module","interest","course");
    const records=rows.slice(1).filter(r=>r.some(x=>x&&String(x).trim())).map(r=>{
      const g=(idx)=>idx>=0?String(r[idx]||"").trim():"";
      const full=g(ni) || (g(fi)+" "+g(li)).trim();
      return { email:g(ei), name:full, modules:g(mi) };
    }).filter(x=>x.email);
    return { records };
  }

  function matchCourses(modulesText){

    const toks=modulesText.split(/[;,\/|]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    const ids=[];
    S.courses.forEach(c=>{ const t=(c.title||"").toLowerCase(); if(toks.some(tk=>tk.length>3 && (t.includes(tk)||tk.includes(t)))) ids.push(c.id); });

  async function runImport(records){
    if(!records || !records.length) return;
    const mode=$("#imp-mode").value, acc=readBoxes("imp"), auto=$("#imp-auto").checked;
    const chosen=[...document.querySelectorAll(".imp-c:checked")].map(c=>c.value);
    const doWelcome=$("#imp-welcome") && $("#imp-welcome").checked;
    const go=$("#imp-go"); go.disabled=true; let ok=0, emailed=0; const fails=[], creds=[];
    for(let n=0;n<records.length;n++){ const r=records[n];
      $("#imp-msg").innerHTML=`<span class="small-link">Importing ${n+1} / ${records.length}…</span>`;
      try{
        if(mode==='invite'){ await NNCC.inviteMember(r.name, r.email); }
        else { const res=await NNCC.addMember(r.name, r.email); if(res&&res.password) creds.push([r.email, r.name, res.password]); }
        try{ await setAccess(r.email,null,acc); }catch(_){}
        if(r.modules){ try{ await sb.from("profiles").update({interests:r.modules}).ilike("email",r.email); }catch(_){} }
        // enrol
        let cids=[...chosen]; if(auto) cids=cids.concat(matchCourses(r.modules));
        cids=[...new Set(cids)];
        if(cids.length){ const { data:pr }=await sb.from("profiles").select("id").ilike("email",r.email).maybeSingle();
          if(pr&&pr.id) await sb.from("course_enrollments").upsert(cids.map(cid=>({course_id:cid,user_id:pr.id,enrolled_by:me.id})),{onConflict:"course_id,user_id"}); }
        ok++;
        if(doWelcome && mode!=='invite'){ try{ const w=await welcomeEmail(r.email, r.name); if(w&&w.ok&&w.sent) emailed++; }catch(_){} }
      }catch(e){ fails.push(r.email+": "+(e.message||e)); }
    }
    go.disabled=false;
    let html=`<div class="msg ${fails.length?'info':'ok'}">Imported ${ok} user(s).${doWelcome&&mode!=='invite'?' Welcome emails sent: '+emailed+'.':''}${fails.length?' Failed: '+fails.length:''}</div>`;
    if(doWelcome && mode!=='invite' && ok>0 && emailed===0) html+=`<div class="small-link" style="margin-top:6px">No welcome emails went out. This usually means email (Resend) is not configured yet — accounts were still created.</div>`;
    if(fails.length) html+=`<div class="small-link" style="margin-top:6px">${fails.slice(0,10).map(esc).join('<br>')}</div>`;
    if(creds.length){ const blobUrl=URL.createObjectURL(new Blob([["Email,Name,Password"].concat(creds.map(c=>c.map(x=>/[",]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(","))).join("\n")],{type:"text/csv"}));
      html+=`<p style="margin-top:8px"><a class="btn outline" href="${blobUrl}" download="imported-credentials.csv">⬇ Download logins (${creds.length})</a> <span class="small-link">Share each person's password with them.</span></p>`; }
    $("#imp-msg").innerHTML=html; await loadCore(); renderMembers();
  }

      const html='Hello,<br><br>Here is your one-click sign-in link for the Harvey Sarnat NNCC Fellowship portal:<br><br>'+
        '<a href="'+link+'" style="background:#0f8a8a;color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:600">Sign in to the portal</a>'+
        '<br><br>This link signs you in without a password and expires within the hour. If it expires, ask the program team for a new one.';
      const res=await sendEmailTo("Your sign-in link — Harvey Sarnat NNCC Fellowship", html, [{email, user_id:uid||null}]);
      if(res && res.ok && res.sent) flash("Sign-in link emailed to "+esc(email)+".","ok");

  async function sendMsg(email, name, uid){
    if(!email){ flash("This member has no email on file.","err"); return; }
    const dialog=$("#message-dialog"), replyTo=await supportEmail();
    dialog.innerHTML=`<div class="message-dialog-inner">
      <div class="message-dialog-head"><div><h2>Email ${esc(name||email)}</h2><div class="small-link">To: ${esc(email)}<br>Portal replies: ${esc(replyTo)}</div></div><button class="message-dialog-close" type="button" aria-label="Close">×</button></div>
      <div id="direct-message-status"></div>
      <div class="field"><label>Subject</label><input id="direct-message-subject" value="Harvey Sarnat NNCC Fellowship"></div>
      <div class="field"><label>Message</label><textarea id="direct-message-body">Hello ${esc(name||'')},\n\n</textarea></div>
      <div class="message-dialog-actions"><button class="btn outline" type="button" id="direct-message-cancel">Cancel</button><button class="btn" type="button" id="direct-message-send">Send email</button></div>
    </div>`;
    dialog.querySelector(".message-dialog-close").addEventListener("click",()=>dialog.close());
    dialog.querySelector("#direct-message-cancel").addEventListener("click",()=>dialog.close());
    dialog.querySelector("#direct-message-send").addEventListener("click",async()=>{
      const subject=dialog.querySelector("#direct-message-subject").value.trim(), plain=dialog.querySelector("#direct-message-body").value.trim();
      if(!subject||!plain){ dialog.querySelector("#direct-message-status").innerHTML='<div class="msg err">Subject and message are required.</div>'; return; }
      const send=dialog.querySelector("#direct-message-send"); send.disabled=true; send.textContent="Sending…";
      const html=esc(plain).replace(/\n/g,"<br>");
      try{
        const res=await sendEmailTo(subject,html,[{email,user_id:uid||null}],{fromName:"NNCC Portal",replyTo:"sarnatnncc@gmail.com"});
        if(res&&res.ok&&Number(res.sent)>0){ dialog.close(); flash("Email sent to "+esc(email)+". Replies will go to sarnatnncc@gmail.com.","ok"); }
        else{ dialog.querySelector("#direct-message-status").innerHTML=`<div class="msg err">${esc((res&&res.error)||"Email was not delivered.")}</div>`; send.disabled=false; send.textContent="Send email"; }
      }catch(e){ dialog.querySelector("#direct-message-status").innerHTML=`<div class="msg err">${esc(e.message||e)}</div>`; send.disabled=false; send.textContent="Send email"; }
    });
    dialog.showModal(); dialog.querySelector("#direct-message-subject").focus();
  }
  // ---------- Full user profile (Thinkific-style, tabbed) ----------
  function uStatus(e){ const now=Date.now();
    if(e.starts_at && new Date(e.starts_at).getTime()>now) return '<span class="badge" style="background:#fff4e5;color:#8a5a00">Scheduled</span>';
    if(e.expires_at && new Date(e.expires_at).getTime()<=now) return '<span class="badge" style="background:#fdecec;color:#8a1f1f">Expired</span>';
    return '<span class="badge" style="background:#e6f4ea;color:#1e7a3a">Active</span>'; }
  function uBar(done,total){ const pct=total?Math.round(done/total*100):0;
    return `<div style="min-width:130px"><div style="height:8px;background:#e8eef6;border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--brand,#144e8c)"></div></div><span class="small-link">${pct}% · ${done}/${total}</span></div>`; }

        if(btn.dataset.unen){ if(!confirm("Unenroll this learner from the selected course?"))return; await sb.from("course_enrollments").delete().eq("course_id",course()).eq("user_id",btn.dataset.unen); loadEnrolled(); }
        if(btn.dataset.editdates){ const cur=emap2[btn.dataset.editdates]||{}; const s=prompt("Start date (YYYY-MM-DD), blank = immediately:", cur.starts_at?cur.starts_at.slice(0,10):''); if(s===null)return; const x=prompt("Expiry date (YYYY-MM-DD), blank = never:", cur.expires_at?cur.expires_at.slice(0,10):''); if(x===null)return; await sb.from("course_enrollments").update({starts_at:s?toIso(s):null,expires_at:x?toIso(x):null}).eq("course_id",course()).eq("user_id",btn.dataset.editdates); loadEnrolled(); }
      }));
      $("#en-remind-all")?.addEventListener("click", async()=>{
        const now=Date.now();
        const recipients=visibleData.filter(e=>{
          const p=prog[e.user_id]||{done:0,total:0};
          return byId[e.user_id]?.email&&byId[e.user_id]?.status!=='suspended'&&p.total&&p.done<p.total&&(!e.starts_at||new Date(e.starts_at).getTime()<=now)&&(!e.expires_at||new Date(e.expires_at).getTime()>now);
        }).map(e=>({email:byId[e.user_id].email,user_id:e.user_id}));
        if(!recipients.length) return flash("No active incomplete learners need a reminder.","info");
        const c=S.courses.find(x=>x.id===course())||{}, link=location.origin+"/learning.html?course="+course();
        const html=`Hello,<br><br>This is a friendly reminder to continue <b>${esc(c.title||"your NNCC course")}</b>.<br><br><a href="${link}" style="background:#0f8a8a;color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:600">Continue learning</a><br><br>Your progress is saved, so you can resume where you stopped.<br><br>Warm regards,<br><b>Dr. Khorshid Mohammad</b>`;
        const btn=$("#en-remind-all"), original=btn.textContent; btn.disabled=true; btn.textContent="Sending…";
        const res=await sendEmailTo(`Reminder: continue ${c.title||"your NNCC course"}`,html,recipients,{fromName:"Dr. Khorshid Mohammad",replyTo:await supportEmail()||undefined});
        btn.disabled=false; btn.textContent=original;
        flash(res&&res.ok?`Reminder sent to ${res.sent}/${res.total} learner(s).`:esc((res&&res.error)||"Reminders could not be sent."),res&&res.ok?"ok":"err");
      });
    }
    async function sendCourseReminder(cid,member,progress,enrollment,btn){
      if(!member.email) return flash("This learner has no email address.","err");
      const c=S.courses.find(x=>x.id===cid)||{}, pct=progress.total?Math.round(progress.done/progress.total*100):0;
      const expiry=enrollment.expires_at?`<br><b>Access expires:</b> ${fmtDate(enrollment.expires_at)}`:"";
      const link=location.origin+"/learning.html?course="+cid;
      const html=`Hello ${esc((member.full_name||"").split(/\s+/)[0]||"there")},<br><br>This is a friendly reminder to continue <b>${esc(c.title||"your NNCC course")}</b>.<br><br><b>Progress:</b> ${progress.done}/${progress.total} lessons (${pct}%)${expiry}<br><br><a href="${link}" style="background:#0f8a8a;color:#fff;padding:11px 20px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:600">Continue learning</a><br><br>Your progress is saved, so you can resume where you stopped.<br><br>Warm regards,<br><b>Dr. Khorshid Mohammad</b>`;
      const original=btn.textContent; btn.disabled=true; btn.textContent="Sending…";
      const res=await sendEmailTo(`Reminder: continue ${c.title||"your NNCC course"}`,html,[{email:member.email,user_id:member.id}],{fromName:"Dr. Khorshid Mohammad",replyTo:await supportEmail()||undefined});
      btn.disabled=false; btn.textContent=original;
      flash(res&&res.ok?`Reminder sent to ${esc(member.email)}.`:esc((res&&res.error)||"Reminder could not be sent."),res&&res.ok?"ok":"err");
    }
    async function doEnroll(){
      const who=$("#en-who").value; let ids=[];
      if(who==='all') ids=S.members.filter(m=>m.status!=='suspended').map(m=>m.id);
      else if(who==='selected') ids=[...document.querySelectorAll(".en-chk:checked")].map(c=>c.value);
      else if(who==='group'){ const { data } = await sb.from("group_members").select("user_id").eq("group_id",$("#en-group").value); ids=(data||[]).map(x=>x.user_id); }
      const active=new Set(S.members.filter(m=>m.status!=='suspended').map(m=>m.id)); ids=[...new Set(ids.filter(id=>active.has(id)))];
      if(!ids.length) return flash("No active members selected.","err");
      const exp=toIso($("#en-exp").value); const start=toIso($("#en-start").value);
      const rows=ids.map(uid=>({course_id:course(),user_id:uid,starts_at:start,expires_at:exp,enrolled_by:me.id}));
      const { error }=await sb.from("course_enrollments").upsert(rows,{onConflict:"course_id,user_id"});
      if(error) return flash(esc(error.message),"err");
      flash(`Enrolled ${ids.length} member(s).`); loadEnrolled();
    }
    async function doCertificates(){
      const who=$("#en-who").value; let ids=[];
      if(who==='all') ids=S.members.filter(m=>m.status!=='suspended').map(m=>m.id);
      else if(who==='selected') ids=[...document.querySelectorAll(".en-chk:checked")].map(c=>c.value);
      else { const {data}=await sb.from("group_members").select("user_id").eq("group_id",$("#en-group").value); ids=(data||[]).map(x=>x.user_id); }
      const active=new Set(S.members.filter(m=>m.status!=='suspended').map(m=>m.id)); ids=[...new Set(ids.filter(id=>active.has(id)))];
      if(!ids.length) return flash("No active members selected.","err");
      const btn=$("#cert-go"); btn.disabled=true; btn.textContent="Checking completion…";
      const {data,error}=await sb.rpc("admin_issue_certificates",{p_course:course(),p_users:ids});
      btn.disabled=false; btn.textContent="Issue certificates to completed learners";
      if(error) return flash(esc(error.message),"err");
      const r=data||{}; flash(`Certificates: ${r.issued||0} newly issued · ${r.existing||0} already issued · ${r.incomplete||0} incomplete.`,"ok");
    }
    loadCourseAccessRequests();
    syncMode();
  }

  // ================= GROUPS =================
  function renderGroups(){
    const scopedPeople=selectedPeople();
    if(scopedPeople.length){
      $("#tab-groups").innerHTML=`${selectionBanner("Groups")}<section class="panel"><h2>Group membership</h2><p class="sub">Manage only the selected member${scopedPeople.length===1?'':'s'}.</p><div id="selected-group-memberships" class="muted-note">Loading…</div></section>`;
      bindSelectionBanner();
      (async()=>{
        const ids=scopedPeople.map(m=>m.id), {data:rows}=await sb.from("group_members").select("group_id,user_id").in("user_id",ids);
        const memberships=new Set((rows||[]).map(r=>`${r.user_id}:${r.group_id}`));
        const box=$("#selected-group-memberships");
        box.innerHTML=scopedPeople.map(m=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)" data-person-groups="${m.id}"><b>${esc(m.full_name||m.email)}</b><span class="small-link" style="margin-left:8px">${esc(m.email||'')}</span><div class="checklist" style="margin:8px 0">${S.groups.map(g=>`<label><input type="checkbox" value="${g.id}" ${memberships.has(`${m.id}:${g.id}`)?'checked':''}> ${esc(g.name)}</label>`).join('')||'<span class="muted-note">No groups have been created.</span>'}</div><button class="btn outline" data-save-person-groups="${m.id}">Save groups</button></div>`).join('');
        box.querySelectorAll("[data-save-person-groups]").forEach(btn=>btn.addEventListener("click",async()=>{
          const uid=btn.dataset.savePersonGroups, wrap=box.querySelector(`[data-person-groups="${uid}"]`), want=new Set([...wrap.querySelectorAll('input:checked')].map(x=>x.value));
          const current=new Set((rows||[]).filter(r=>r.user_id===uid).map(r=>r.group_id));
          const add=[...want].filter(g=>!current.has(g)).map(group_id=>({group_id,user_id:uid})), del=[...current].filter(g=>!want.has(g));
          if(add.length)await sb.from("group_members").insert(add); for(const gid of del)await sb.from("group_members").delete().eq("group_id",gid).eq("user_id",uid);
          flash("Group membership saved."); await loadCore(); renderGroups();
        }));
      })();
      return;
    }
    $("#tab-groups").innerHTML=`
      <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Groups</h2>
        <button class="btn" id="g-new">+ New group</button></div>
        <div id="g-list" style="margin-top:10px"></div></section>
      <section class="panel" id="g-detail" style="display:none"></section>`;
    $("#g-new").addEventListener("click", async ()=>{ const n=prompt("Group name:"); if(!n)return; await sb.from("groups").insert({name:n.trim()}); await loadCore(); renderGroups(); });
    (async()=>{
      const counts={};
      const { data:gm } = await sb.from("group_members").select("group_id");
      (gm||[]).forEach(x=>counts[x.group_id]=(counts[x.group_id]||0)+1);
      $("#g-list").innerHTML = S.groups.length? `<table class="tbl"><thead><tr><th>Group</th><th>Members</th><th></th></tr></thead><tbody>`+
        S.groups.map(g=>`<tr><td><b>${esc(g.name)}</b>${g.description?`<br><span class="small-link">${esc(g.description)}</span>`:''}</td><td>${counts[g.id]||0}</td>
          <td class="row-actions"><button data-manage="${g.id}">Manage</button><button data-grename="${g.id}">Rename</button><button data-gdel="${g.id}">Delete</button></td></tr>`).join("")+
        `</tbody></table>` : '<p class="muted-note">No groups yet.</p>';
      $("#g-list").querySelectorAll("button").forEach(b=>b.addEventListener("click", async ()=>{
        if(b.dataset.manage) return manageGroup(b.dataset.manage);
        if(b.dataset.grename){ const g=S.groups.find(x=>x.id===b.dataset.grename); const n=prompt("Group name:",g.name); if(n===null)return; await sb.from("groups").update({name:n.trim()}).eq("id",g.id); await loadCore(); renderGroups(); }
        if(b.dataset.gdel){ if(!confirm("Delete this group?"))return; await sb.from("groups").delete().eq("id",b.dataset.gdel); await loadCore(); renderGroups(); }
      }));
    })();
  }
  async function manageGroup(gid){
    const g=S.groups.find(x=>x.id===gid)||{};
    const { data:gm } = await sb.from("group_members").select("user_id").eq("group_id",gid);
    const inSet=new Set((gm||[]).map(x=>x.user_id));
    const box=$("#g-detail"); box.style.display="block";
    box.innerHTML=`<h2>${esc(g.name)}, members</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0">
        <input id="gm-search" type="search" placeholder="Search members…" style="max-width:280px">
        <button class="chip-btn" id="gm-all" type="button">Select all visible</button>
        <button class="chip-btn" id="gm-none" type="button">Clear visible</button>
      </div>
      <div class="checklist" style="margin:8px 0">${S.members.map(m=>`<label><input type="checkbox" class="gm-chk" value="${m.id}" ${inSet.has(m.id)?'checked':''}> ${esc(m.full_name||m.email)} <span class="small-link">${esc(m.email)}</span></label>`).join("")}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="gm-save">Save members</button>
        <select id="gm-course" style="padding:9px;border:1.5px solid var(--line);border-radius:10px">${S.courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select>
        <input type="date" id="gm-start" title="Start date (optional)" style="padding:9px;border:1.5px solid var(--line);border-radius:10px">
        <input type="date" id="gm-exp" title="Expiry date (optional)" style="padding:9px;border:1.5px solid var(--line);border-radius:10px">
        <button class="btn outline" id="gm-enroll">Enroll group into course</button>
      </div>`;
    const gmLabels=[...box.querySelectorAll(".checklist label")];
    $("#gm-search").addEventListener("input",e=>{ const q=e.target.value.trim().toLowerCase(); gmLabels.forEach(l=>l.style.display=!q||l.textContent.toLowerCase().includes(q)?'':'none'); });
    $("#gm-all").addEventListener("click",()=>gmLabels.filter(l=>l.style.display!=='none').forEach(l=>l.querySelector("input").checked=true));
    $("#gm-none").addEventListener("click",()=>gmLabels.filter(l=>l.style.display!=='none').forEach(l=>l.querySelector("input").checked=false));
    $("#gm-save").addEventListener("click", async ()=>{
      const want=new Set([...box.querySelectorAll(".gm-chk:checked")].map(c=>c.value));
      const toAdd=[...want].filter(id=>!inSet.has(id)).map(id=>({group_id:gid,user_id:id}));
      const toDel=[...inSet].filter(id=>!want.has(id));
      if(toAdd.length) await sb.from("group_members").insert(toAdd);
      for(const id of toDel) await sb.from("group_members").delete().eq("group_id",gid).eq("user_id",id);
      flash("Group members saved."); renderGroups(); manageGroup(gid);
    });
    $("#gm-enroll").addEventListener("click", async ()=>{
      const ids=[...box.querySelectorAll(".gm-chk:checked")].map(c=>c.value);
      if(!ids.length) return flash("No members in group.","err");
      const exp=toIso($("#gm-exp").value); const gstart=toIso($("#gm-start").value);
      const rows=ids.map(uid=>({course_id:$("#gm-course").value,user_id:uid,starts_at:gstart,expires_at:exp,enrolled_by:me.id}));
      const { error }=await sb.from("course_enrollments").upsert(rows,{onConflict:"course_id,user_id"});
      flash(error?esc(error.message):`Enrolled ${ids.length} group member(s).`, error?"err":"ok");
    });
  }

  // ================= EMAIL =================
  function renderEmail(){
    $("#tab-email").innerHTML=`
      ${selectionBanner("Notifications & email")}
      <section class="panel"><h2>Compose email</h2>
        <div id="em-msg"></div>
        <div class="row2">
          <div class="field"><label>Recipients</label><select id="em-who">
            <option value="all">All members</option><option value="group">A group</option><option value="selected">Selected members</option></select></div>
          <div class="field" id="em-groupwrap" style="display:none"><label>Group</label><select id="em-group">${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select></div>
        </div>
        <div id="em-select" style="display:none"><label class="muted-note">Select members</label>
          <div class="checklist">${S.members.map(m=>`<label><input type="checkbox" class="em-chk" value="${esc(m.email)}"> ${esc(m.full_name||m.email)} <span class="small-link">${esc(m.email)}</span></label>`).join("")}</div></div>
        <div class="field"><label>Subject</label><input id="em-subj"></div>
        <div class="field"><label>Message (basic HTML allowed)</label><textarea id="em-body" rows="8"></textarea></div>
        <div id="em-count" class="small-link" style="margin-bottom:8px"></div>
        <button class="btn" id="em-send">Review &amp; send email</button>
      </section>
      <section class="panel"><h2>${selectedMembers.size?'Email history for selected member':'Recent emails'}</h2><div id="em-log"></div></section>`;
    bindSelectionBanner();
    const updateEmailCount=async()=>{ const r=await recipientEmails(); $("#em-count").textContent=`${r.length} active recipient${r.length===1?'':'s'} selected`; };
    $("#em-who").addEventListener("change",()=>{ const v=$("#em-who").value; $("#em-groupwrap").style.display=v==='group'?'block':'none'; $("#em-select").style.display=v==='selected'?'block':'none'; updateEmailCount(); });
    $("#em-group").addEventListener("change",updateEmailCount);
    $("#em-select").addEventListener("change",updateEmailCount);
    $("#em-send").addEventListener("click", sendEmail);
    const initialEmailIds=pendingEmailIds.length?pendingEmailIds:selectedIds();
    if(initialEmailIds.length){
      const emails=new Set(S.members.filter(m=>initialEmailIds.includes(m.id)).map(m=>(m.email||'').toLowerCase()));
      $("#em-who").value="selected"; $("#em-select").style.display="block";
      document.querySelectorAll(".em-chk").forEach(c=>c.checked=emails.has(c.value.toLowerCase())); pendingEmailIds=[];
    }
    updateEmailCount(); loadEmailLog();
  }
  async function recipientEmails(){
    const who=$("#em-who").value;
    const active=S.members.filter(m=>m.status!=='suspended'&&m.email); let rows=[];
    if(who==='all') rows=active.map(m=>({email:m.email,user_id:m.id}));
    else if(who==='selected'){ const chosen=new Set([...document.querySelectorAll(".em-chk:checked")].map(c=>c.value.toLowerCase())); rows=active.filter(m=>chosen.has(m.email.toLowerCase())).map(m=>({email:m.email,user_id:m.id})); }
    if(who==='group'){ const { data } = await sb.from("group_members").select("user_id").eq("group_id",$("#em-group").value);
      const set=new Set((data||[]).map(x=>x.user_id)); rows=active.filter(m=>set.has(m.id)).map(m=>({email:m.email,user_id:m.id})); }
    const seen=new Set(); return rows.filter(r=>{ const k=r.email.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true; });
  }
  async function sendEmail(){
    const subject=$("#em-subj").value.trim(), body=$("#em-body").value.trim();
    if(!subject||!body) return $("#em-msg").innerHTML='<div class="msg err">Subject and message are required.</div>';
    const recipients=await recipientEmails();
    if(!recipients.length) return $("#em-msg").innerHTML='<div class="msg err">No recipients.</div>';
    if(!confirm(`Send this email to ${recipients.length} active recipient${recipients.length===1?'':'s'}?`)) return;
    $("#em-msg").innerHTML='<span class="small-link">Sending…</span>';
    try{
      const { data:s } = await sb.auth.getSession(); const token=s?.session?.access_token;
      const res=await fetch(`${window.PORTAL_CONFIG.SUPABASE_URL}/functions/v1/send-email`,{
        method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}`, apikey:window.PORTAL_CONFIG.SUPABASE_ANON_KEY },
        body: JSON.stringify({ subject, body, recipients })});
      const b=await res.json();
      if(b.error && !b.ok){ $("#em-msg").innerHTML=`<div class="msg info">${esc(b.error)}</div>`; }
      else { $("#em-msg").innerHTML=`<div class="msg ok">Sent to ${b.sent}/${b.total} recipient(s).</div>`; $("#em-subj").value="";$("#em-body").value=""; }
      loadEmailLog();
    }catch(e){ $("#em-msg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  }
  async function loadEmailLog(){
    const scope=selectedIds(); let data=[], recipients=[];
    if(scope.length){
      const {data:r}=await sb.from("email_recipients").select("message_id,status,error,user_id").in("user_id",scope); recipients=r||[];
      const ids=[...new Set(recipients.map(r=>r.message_id))]; if(ids.length){const {data:m}=await sb.from("email_messages").select("*").in("id",ids).order("created_at",{ascending:false}).limit(10);data=m||[];}
    } else {
      const {data:m}=await sb.from("email_messages").select("*").order("created_at",{ascending:false}).limit(10); data=m||[];
      const ids=data.map(m=>m.id); if(ids.length){const {data:r}=await sb.from("email_recipients").select("message_id,status,error,user_id").in("message_id",ids);recipients=r||[];}
    }
    const delivery=(id)=>{ const rows=recipients.filter(r=>r.message_id===id); return {sent:rows.filter(r=>r.status==='sent').length,failed:rows.filter(r=>r.status==='failed'||r.status==='not_sent').length,pending:rows.filter(r=>!['sent','failed','not_sent'].includes(r.status)).length}; };
    $("#em-log").innerHTML=(data||[]).length? `<table class="tbl"><thead><tr><th>Date</th><th>Subject</th><th>Recipients</th></tr></thead><tbody>`+
      data.map(m=>{ const d=delivery(m.id); return `<tr><td>${new Date(m.created_at).toLocaleString()}</td><td>${esc(m.subject)}</td><td>${d.sent} sent${d.failed?` · <span style="color:#a33">${d.failed} failed</span>`:''}${d.pending?` · ${d.pending} pending`:''} <span class="small-link">(${m.recipient_count} total)</span></td></tr>`; }).join("")+`</tbody></table>`
      : `<p class="muted-note">No emails sent${scope.length?' to the selected member':' yet'}.</p>`;
  }

  // ---------- modal helper ----------
  function openModal(title, html, onMount){
    let bg=document.getElementById("pm-modal");
    if(!bg){ bg=document.createElement("div"); bg.id="pm-modal";
      bg.style.cssText="position:fixed;inset:0;background:rgba(12,42,77,.5);display:grid;place-items:center;z-index:80;padding:20px";
      document.body.appendChild(bg); bg.addEventListener("click",(e)=>{ if(e.target===bg) bg.remove(); }); }
    bg.innerHTML=`<div style="background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)"><h2 style="margin:0;font-size:1.15rem">${title}</h2><button class="chip-btn" id="pm-close">✕</button></div>
      <div style="padding:20px" id="pm-body">${html}</div></div>`;
    bg.querySelector("#pm-close").addEventListener("click",()=>bg.remove());
    if(onMount) onMount(bg.querySelector("#pm-body"));
  }

  render("members");
})();
</script>
