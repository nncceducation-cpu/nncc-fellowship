<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memberships, Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .checklist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
  .checklist label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px}
  .checklist label:hover{background:var(--bg-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:620px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="container">
  <a class="brand" href="portal.html"><img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
    <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>Memberships</span></span></a>
  <nav class="nav"><a href="portal.html">Portal</a><a href="people.html">People</a><a href="memberships.html" class="active">Memberships</a><span class="user-chip" id="user-chip"></span></nav>
</div></header>
<main class="portal-wrap"><div class="container">
  <div class="p-head"><h1>Memberships</h1><p>Bundle a set of courses into a membership and grant it to members. Assigning a membership enrols the member in all of its courses.</p></div>
  <div id="msg"></div>
  <section class="panel"><h2>New membership</h2>
    <div class="row2">
      <div class="field"><label>Name</label><input id="m-name" placeholder="e.g. NNCC Fellows"></div>
      <div class="field"><label>Note (optional)</label><input id="m-note" placeholder="e.g. Full access, 1 year"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="m-desc" rows="2"></textarea></div>
    <button class="btn" id="m-add">Create membership</button>
  </section>
  <div id="list"><div class="empty">Loading…</div></div>
</div></main>
<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal-auth.js"></script>
<script src="portal-shell.js"></script>
<script>
(async function(){
  const me=await NNCC.requireAdmin(); if(!me) return;
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb=NNCC.client, $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const flash=(t,k)=>{ $("#msg").innerHTML=t?`<div class="msg ${k||'ok'}">${t}</div>`:""; if(t) setTimeout(()=>$("#msg").innerHTML="",4000); };
  let S={courses:[],members:[]};

  $("#m-add").addEventListener("click", async ()=>{
    const name=$("#m-name").value.trim(); if(!name){ flash("Name required.","err"); return; }
    const { error }=await sb.from("memberships").insert({ name, price_note:$("#m-note").value.trim()||null, description:$("#m-desc").value.trim()||null });
    if(error){ flash(esc(error.message),"err"); return; }
    $("#m-name").value=$("#m-note").value=$("#m-desc").value=""; flash("Membership created."); load();
  });

  async function load(){
    const [{data:mships},{data:mc},{data:mm},{data:courses},{data:members}] = await Promise.all([
      sb.from("memberships").select("*").order("created_at"),
      sb.from("membership_courses").select("*"),
      sb.from("membership_members").select("*"),
      sb.from("courses").select("id,title").order("sort_order"),
      sb.from("members_overview").select("id,full_name,email").order("full_name"),
    ]);
    S.courses=courses||[]; S.members=members||[];
    const nameById={}; S.members.forEach(m=>nameById[m.id]=m.full_name||m.email);
    const courseIds=(id)=>new Set((mc||[]).filter(x=>x.membership_id===id).map(x=>x.course_id));
    const mems=(id)=>(mm||[]).filter(x=>x.membership_id===id);
    $("#list").innerHTML=(mships||[]).map(m=>{
      const ci=courseIds(m.id);
      const courseBoxes=S.courses.map(c=>`<label><input type="checkbox" class="mc" data-m="${m.id}" data-c="${c.id}" ${ci.has(c.id)?'checked':''}> ${esc(c.title)}</label>`).join("");
      const memRows=mems(m.id).map(x=>`<tr><td>${esc(nameById[x.user_id]||x.user_id)}</td><td>${x.expires_at?new Date(x.expires_at).toLocaleDateString():'no expiry'}</td>
        <td class="row-actions"><button data-rm="${m.id}|${x.user_id}">Remove</button></td></tr>`).join("");
      const addOpts=S.members.filter(mem=>!mems(m.id).some(x=>x.user_id===mem.id)).map(mem=>`<option value="${mem.id}">${esc(mem.full_name||mem.email)}</option>`).join("");
      return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${esc(m.name)}</h2>
          <button class="chip-btn" data-delm="${m.id}">Delete membership</button></div>
        ${m.price_note?`<p class="sub">${esc(m.price_note)}</p>`:''}${m.description?`<p style="color:var(--muted)">${esc(m.description)}</p>`:''}
        <div class="row2" style="margin-top:8px">
          <div><label style="font-weight:600;font-size:13px">Courses included</label><div class="checklist" style="margin-top:6px">${courseBoxes||'<span class="small-link">No courses yet.</span>'}</div></div>
          <div><label style="font-weight:600;font-size:13px">Members (${mems(m.id).length})</label>
            <table class="tbl" style="margin-top:6px"><tbody>${memRows||'<tr><td class="small-link">None yet.</td></tr>'}</tbody></table>
            <div style="display:flex;gap:8px;margin-top:8px"><select data-addsel="${m.id}" style="flex:1"><option value="">Add a member…</option>${addOpts}</select>
              <input type="date" data-addexp="${m.id}" title="Expiry (optional)"><button class="btn" data-addbtn="${m.id}">Add</button></div>
          </div>
        </div></section>`;
    }).join("") || '<div class="empty">No memberships yet.</div>';

    document.querySelectorAll(".mc").forEach(cb=>cb.addEventListener("change",async()=>{
      const mid=cb.dataset.m, cid=cb.dataset.c;
      if(cb.checked){ await sb.from("membership_courses").upsert({membership_id:mid,course_id:cid});
        // enrol existing members in the newly added course
        const users=mems(mid).map(x=>x.user_id);
        if(users.length) await sb.from("course_enrollments").upsert(users.map(u=>({course_id:cid,user_id:u,enrolled_by:me.id})),{onConflict:"course_id,user_id"});
      } else { await sb.from("membership_courses").delete().eq("membership_id",mid).eq("course_id",cid); }
      flash("Updated.");
    }));
    document.querySelectorAll("[data-addbtn]").forEach(b=>b.addEventListener("click",async()=>{
      const mid=b.dataset.addbtn; const uid=document.querySelector(`[data-addsel="${mid}"]`).value; if(!uid){ flash("Pick a member.","err"); return; }
      const exp=document.querySelector(`[data-addexp="${mid}"]`).value; const expIso=exp?new Date(exp+"T23:59:59").toISOString():null;
      await sb.from("membership_members").upsert({membership_id:mid,user_id:uid,expires_at:expIso});
      const cids=[...courseIds(mid)];
      if(cids.length) await sb.from("course_enrollments").upsert(cids.map(cid=>({course_id:cid,user_id:uid,expires_at:expIso,enrolled_by:me.id})),{onConflict:"course_id,user_id"});
      flash("Member added and enrolled."); load();
    }));
    document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",async()=>{
      const [mid,uid]=b.dataset.rm.split("|"); if(!confirm("Remove this member from the membership (and unenrol from its courses)?"))return;
      await sb.from("membership_members").delete().eq("membership_id",mid).eq("user_id",uid);
      const cids=[...courseIds(mid)]; if(cids.length) await sb.from("course_enrollments").delete().in("course_id",cids).eq("user_id",uid);
      flash("Removed."); load();
    }));
    document.querySelectorAll("[data-delm]").forEach(b=>b.addEventListener("click",async()=>{
      if(!confirm("Delete this membership? (Members keep any course enrolments already granted.)"))return;
      await sb.from("memberships").delete().eq("id",b.dataset.delm); flash("Deleted."); load();
    }));
  }
  load();
})();
</script>
</body>
</html>
