<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video</title>
<style>
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
  .wrap{ position:fixed; inset:0; }
  iframe{ width:100%; height:100%; border:0; display:block; }
  .msg{ color:#fff; font-family:-apple-system,Roboto,sans-serif; text-align:center;
        position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; }
</style>
</head>
<body>
  <div class="wrap" id="wrap"></div>
  <script>
    (function () {
      var v = new URLSearchParams(location.search).get("v") || "";
      var mm = v.match(/[A-Za-z0-9_-]{11}/);
      var id = mm ? mm[0] : "";
      var wrap = document.getElementById("wrap");
      if (!id) { wrap.innerHTML = '<div class="msg">Video unavailable.</div>'; return; }
      var f = document.createElement("iframe");
      f.src = "https://www.youtube.com/embed/" + id +
              "?playsinline=1&rel=0&modestbranding=1&fs=1&iv_load_policy=3";
      f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      f.setAttribute("allowfullscreen", "");
      f.setAttribute("title", "Lesson video");
      wrap.appendChild(f);
    })();
  </script>
</body>
</html>
