<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile, Harvey Sarnat NNCC Fellowship</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css?v=6d84165"><link rel="stylesheet" href="portal-mobile.css">
<script src="app-boot.js" defer></script><link rel="icon" href="favicon.ico" sizes="any">
</head>
<body>
<header class="topbar"><div class="container"><a class="brand" href="portal.html"><img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0"><span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>My Profile</span></span></a><nav class="nav"><a href="portal.html">Portal</a><a href="learning.html">Modules</a><span class="user-chip" id="user-chip"></span></nav></div></header>
<main class="portal-wrap"><div class="container narrow"><div class="p-head"><h1>My Profile</h1><p>Manage your name, institution, professional details, email, and password.</p></div><div id="msg"></div>
<section class="panel"><h2>Profile details</h2><div class="inline-form"><div class="field"><label>Full name</label><input id="p-name"></div><div class="field"><label>Institution</label><input id="p-inst"></div><div class="field"><label>Country</label><input id="p-country"></div><div class="field"><label>Profession</label><input id="p-prof"></div><button class="btn" id="p-save">Save profile</button></div></section>
<section class="panel"><h2>Sign-in email</h2><p class="sub">Changing your email sends a confirmation message to the new address.</p><div class="inline-form"><div class="field"><label>Email</label><input id="p-email" type="email"></div><button class="btn" id="p-email-save">Update email</button></div></section>
<section class="panel"><h2>Password</h2><div class="inline-form"><div class="field"><label>New password</label><input id="p-pass" type="password" minlength="8"></div><div class="field"><label>Confirm password</label><input id="p-pass2" type="password" minlength="8"></div><button class="btn" id="p-pass-save">Update password</button></div></section>
</div></main>
<script src="portal-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-auth.js"></script><script src="portal-shell.js"></script>
<script>(async()=>{const me=await NNCC.requireAuth();if(!me)return;NNCC.mountUserChip(document.getElementById('user-chip'));const sb=NNCC.client,$=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),flash=(t,k='ok')=>{$('#msg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`;scrollTo({top:0,behavior:'smooth'});};const p=await NNCC.profile();$('#p-name').value=p.full_name||'';$('#p-inst').value=p.institution||'';$('#p-country').value=p.country||'';$('#p-prof').value=p.profession||'';$('#p-email').value=me.email||p.email||'';$('#p-save').onclick=async()=>{const{error}=await sb.from('profiles').update({full_name:$('#p-name').value.trim(),institution:$('#p-inst').value.trim()||null,country:$('#p-country').value.trim()||null,profession:$('#p-prof').value.trim()||null}).eq('id',me.id);flash(error?error.message:'Profile saved.',error?'err':'ok');};$('#p-email-save').onclick=async()=>{const email=$('#p-email').value.trim();const{error}=await sb.auth.updateUser({email},{emailRedirectTo:location.origin+'/profile.html'});flash(error?error.message:'Confirmation sent to your new email address.',error?'err':'ok');};$('#p-pass-save').onclick=async()=>{const a=$('#p-pass').value,b=$('#p-pass2').value;if(a.length<8)return flash('Use at least 8 characters.','err');if(a!==b)return flash('Passwords do not match.','err');const{error}=await NNCC.setPassword(a);flash(error?error.message:'Password updated.',error?'err':'ok');if(!error){$('#p-pass').value='';$('#p-pass2').value='';}};})();</script>
</body></html>
