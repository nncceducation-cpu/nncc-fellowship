<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate, Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .cert-wrap{max-width:900px;margin:26px auto;padding:0 16px}
  .cert{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:0;overflow:hidden}
  .cert-inner{border:3px double var(--gold);margin:18px;padding:44px 40px;text-align:center;border-radius:8px;
    background:radial-gradient(1200px 300px at 50% -10%, var(--teal-50), #fff 60%)}
  .cert .mark{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 14px}
  .cert .eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:12.5px;color:var(--muted);font-weight:600}
  .cert h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:8px 0 4px}
  .cert .name{font-family:var(--font-serif);font-size:clamp(1.6rem,4vw,2.3rem);color:var(--teal-600);margin:18px 0 6px}
  .cert .line{color:var(--muted);max-width:60ch;margin:6px auto}
  .cert .course{font-weight:700;color:var(--navy);font-size:1.25rem;margin:6px 0 18px}
  .cert .foot{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .cert .sig{border-top:1.5px solid var(--line);padding-top:6px;min-width:200px}
  .noprint{margin:16px auto;max-width:900px;padding:0 16px;display:flex;gap:10px;justify-content:flex-end}
  @media print{ .topbar.noprint{display:none!important} body{background:#fff} .cert{box-shadow:none;border:0} }
  /* custom uploaded template */
  .cert-custom{position:relative;aspect-ratio:1.414/1;background-size:cover;background-position:center;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .cert-custom .cert-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7% 11%}
  .cert-custom .eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:12px;color:var(--muted);font-weight:600}
  .cert-custom .line{color:var(--muted);margin:4px auto;max-width:60ch}
  .cert-custom .name{font-family:var(--font-serif);font-size:clamp(1.5rem,3.4vw,2.4rem);color:var(--teal-600);margin:10px 0 6px}
  .cert-custom .course{font-weight:700;color:var(--navy);font-size:1.2rem;margin:6px 0 14px}
  .cert-custom .cert-foot2{display:flex;gap:28px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:var(--muted)}
  .cert-custom .sigcol{text-align:center}
  .cert-custom .sig-img{height:44px;object-fit:contain;display:block;margin:0 auto 4px}
  .cert-custom .sigline{border-top:1.5px solid rgba(0,0,0,.28);padding-top:5px;min-width:150px}
  .cert-custom.cert-dark .eyebrow,.cert-custom.cert-dark .line,.cert-custom.cert-dark .course,.cert-custom.cert-dark .name,.cert-custom.cert-dark .sigline{color:#fff}
  .cert-custom.cert-dark .sigline{border-top-color:rgba(255,255,255,.5)}
  @media print{ .cert-custom{box-shadow:none} }
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a class="brand" href="portal.html"><img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
      <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>Certificate</span></span></a>
    <nav class="nav"><a href="portal.html">Portal</a><a href="learning.html">Courses</a><span class="user-chip" id="user-chip"></span></nav>
  </div>
</header>

<div class="noprint">
  <a class="btn outline" href="learning.html">← Courses</a>
  <button class="btn" onclick="window.print()">🖶 Print / Save as PDF</button>
</div>
<div class="cert-wrap"><div id="cert"></div></div>

<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal-auth.js"></script>
<script src="portal-shell.js"></script>
<script>
(async function(){
  const me=await NNCC.requireAccess("modules"); if(!me) return;
  const prof=await NNCC.profile();
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb=NNCC.client, $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const courseId=new URLSearchParams(location.search).get("course");
  if(!courseId){ $("#cert").innerHTML='<div class="empty">No course specified.</div>'; return; }

  const { data:course } = await sb.from("courses").select("*").eq("id",courseId).single();
  let { data:cert } = await sb.from("certificates").select("*").eq("course_id",courseId).eq("user_id",me.id).maybeSingle();
  if(!cert){ // try to claim if complete
    const { data:res } = await sb.rpc("claim_certificate",{ p_course:courseId });
    if(res && res.issued){ const r=await sb.from("certificates").select("*").eq("course_id",courseId).eq("user_id",me.id).maybeSingle(); cert=r.data; }
  }
  if(!cert){ $("#cert").innerHTML='<div class="empty">You haven’t completed this course yet, so no certificate is available.</div>'; return; }
  const dt=new Date(cert.issued_at).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});

  // Custom branding (uploaded by admin in Admin → Certificate design)
  const { data:ss } = await sb.from("site_settings").select("*").eq("id",1).maybeSingle();
  const sigName = (ss&&ss.cert_sig_name) || "Dr. Khorshid Mohammad";
  const sigTitle= (ss&&ss.cert_sig_title) || "Program Director";
  const sigImg  = ss&&ss.cert_sig_url;
  const name = esc(prof.full_name||prof.email);
  const title = esc(course?course.title:'');
  const note = course&&course.pass_note?`<p class="line">${esc(course.pass_note)}</p>`:'';
  const sigImgHtml = sigImg?`<img class="sig-img" src="${esc(sigImg)}" alt="Signature">`:'';

  if(ss && ss.cert_bg_url){
    // Custom uploaded template: overlay recipient details in the centre
    $("#cert").innerHTML=`<div class="cert-custom ${ss.cert_text_dark?'cert-dark':''}" style="background-image:url('${esc(ss.cert_bg_url)}')">
      <div class="cert-body">
        <div class="eyebrow">Certificate of Completion</div>
        <p class="line">This certifies that</p>
        <div class="name">${name}</div>
        <p class="line">has successfully completed</p>
        <div class="course">${title}</div>
        ${note}
        <div class="cert-foot2">
          <div class="sigcol">${sigImgHtml}<div class="sigline">${esc(sigName)}<br><span>${esc(sigTitle)}</span></div></div>
          <div class="sigcol"><div class="sigline">${esc(dt)}<br><span>Date issued</span></div></div>
          <div class="sigcol"><div class="sigline">${esc(cert.serial)}<br><span>Certificate ID</span></div></div>
        </div>
      </div></div>`;
  } else {
    // Built-in layout
    $("#cert").innerHTML=`<div class="cert"><div class="cert-inner">
      <img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
      <div class="eyebrow">Certificate of Completion</div>
      <h1>Harvey Sarnat NNCC Fellowship</h1>
      <p class="line">This certifies that</p>
      <div class="name">${name}</div>
      <p class="line">has successfully completed</p>
      <div class="course">${title}</div>
      ${note}
      <div class="foot">
        <div class="sig">${sigImg?`<img src="${esc(sigImg)}" alt="Signature" style="height:42px;display:block;margin:0 auto 4px">`:''}${esc(sigName)}<br><span>${esc(sigTitle)}</span></div>
        <div class="sig">${esc(dt)}<br><span>Date issued</span></div>
        <div class="sig">${esc(cert.serial)}<br><span>Certificate ID</span></div>
      </div>
    </div></div>`;
  }
})();
</script>
</body>
</html>
