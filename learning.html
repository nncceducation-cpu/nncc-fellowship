<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses, Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .prog { height:7px;border-radius:999px;background:var(--navy-50);overflow:hidden;margin-top:10px }
  .prog > i { display:block;height:100%;background:var(--teal) }
  .lesson-text img{max-width:100%;border-radius:8px}
  .lesson-text h1,.lesson-text h2,.lesson-text h3{font-family:var(--font-serif);color:var(--navy)}
  .lesson-text{line-height:1.65}
  .lesson-text ul,.lesson-text ol{margin:10px 0;padding-left:26px}
  .lesson-text blockquote{border-left:3px solid var(--teal);margin:12px 0;padding:2px 0 2px 14px;color:var(--muted)}
  .lesson-text a{color:var(--teal-600)}
  .lesson-text .ql-align-center{text-align:center}
  .lesson-text .ql-align-right{text-align:right}
  .lesson-text .ql-align-justify{text-align:justify}
  .lesson-text .ql-indent-1{padding-left:3em}.lesson-text .ql-indent-2{padding-left:6em}
  .lesson-text .ql-indent-3{padding-left:9em}.lesson-text .ql-indent-4{padding-left:12em}
  .embed-wrap iframe{max-width:100%}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumbs a{color:var(--muted)}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="portal.html">
      <img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
      <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>Courses</span></span>
    </a>
    <nav class="nav">
      <a href="portal.html">Portal</a>
      <a href="learning.html" class="active">Courses</a>
      <a href="forum.html">Forum</a>
      <span class="user-chip" id="user-chip"></span>
    </nav>
  </div>
</header>

<main class="portal-wrap">
  <div class="container narrow" id="root"></div>
</main>

<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal-auth.js"></script>
<script src="portal-shell.js"></script>
<script src="portal-media.js"></script>
<script>
(async function () {
  const me = await NNCC.requireAccess("modules"); if(!me) return;
  const prof = await NNCC.profile();
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb = NNCC.client, PM = window.PortalMedia;
  const $=(s)=>document.querySelector(s), esc=PM.esc, root=$("#root");
  const isAdmin = prof.role==="admin";
  const qs=new URLSearchParams(location.search);
  const courseId=qs.get("course"), lessonId=qs.get("lesson"), bundleId=qs.get("bundle");

  if(lessonId) showLesson(lessonId);
  else if(courseId) showCourse(courseId);
  else if(bundleId) showBundle(bundleId);
  else showCourses();

  async function myDone(){ const { data } = await sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id); return new Set((data||[]).map(p=>p.lesson_id)); }

  // ---------- Course catalog ----------
  const active=(e)=> !e.expires_at || new Date(e.expires_at) > new Date();
  async function showCourses(){
    const [{data:courses},{data:mods},{data:les},{data:enr},{data:bundles},{data:bcs},{data:benr}] = await Promise.all([
      sb.from("courses").select("*").order("sort_order").order("created_at"),
      sb.from("modules").select("id,course_id"),
      sb.from("lessons").select("id,module_id"),
      sb.from("course_enrollments").select("course_id,expires_at").eq("user_id",me.id),
      sb.from("bundles").select("*").order("sort_order").order("created_at"),
      sb.from("bundle_courses").select("*"),
      sb.from("bundle_enrollments").select("bundle_id,expires_at").eq("user_id",me.id),
    ]);
    const done=await myDone();
    const modByCourse={}, lesByMod={};
    (mods||[]).forEach(m=>{(modByCourse[m.course_id]=modByCourse[m.course_id]||[]).push(m.id);});
    (les||[]).forEach(l=>{(lesByMod[l.module_id]=lesByMod[l.module_id]||[]).push(l.id);});
    const stats=(cid)=>{ let t=0,d=0; (modByCourse[cid]||[]).forEach(mid=>(lesByMod[mid]||[]).forEach(lid=>{t++; if(done.has(lid))d++;})); return {t,d}; };
    const enrolled=new Set((enr||[]).filter(active).map(e=>e.course_id));
    const benrolled=new Set((benr||[]).filter(active).map(e=>e.bundle_id));
    const bmap={}; (bcs||[]).forEach(x=>{(bmap[x.bundle_id]=bmap[x.bundle_id]||[]).push(x.course_id);});
    const granted=new Set(); benrolled.forEach(bid=>(bmap[bid]||[]).forEach(cid=>granted.add(cid)));
    const stateOf=(c)=> isAdmin||!c.enrollment_required ? 'open'
      : (enrolled.has(c.id)||granted.has(c.id)) ? 'enrolled'
      : c.self_enroll ? 'signup' : 'locked';

    const listC = isAdmin ? (courses||[]) : (courses||[]).filter(c=>c.visibility==='published');
    const listB = isAdmin ? (bundles||[]) : (bundles||[]).filter(b=>b.visibility==='published');

    const courseCard=(c)=>{ const s=stats(c.id); const pct=s.t?Math.round(s.d/s.t*100):0; const st=stateOf(c);
      const cover=c.cover_url?`<img src="${esc(c.cover_url)}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:'';
      const badges=`${c.visibility!=='published'&&isAdmin?`<span class="badge admin">${esc(c.visibility)}</span> `:''}`;
      const clickable = (st==='open'||st==='enrolled');
      const action = st==='signup'
        ? `<button class="btn" data-signup="${c.id}" style="margin-top:10px">Sign up</button>`
        : st==='locked' ? `<span class="small-link">🔒 Enrollment by administrator</span>`
        : `<div class="prog"><i style="width:${pct}%"></i></div><span class="small-link">${s.d}/${s.t} lessons · ${pct}%</span>`;
      const inner=`${cover}<h3>${esc(c.title)} ${badges}</h3><p>${esc(c.description||'')}</p>${action}`;
      return clickable ? `<a class="p-card" href="learning.html?course=${c.id}">${inner}</a>`
        : `<div class="p-card" style="cursor:default">${inner}</div>`;
    };
    const bundleCard=(b)=>{ const enrolledB=benrolled.has(b.id); const cover=b.cover_url?`<img src="${esc(b.cover_url)}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:'';
      const action = enrolledB||isAdmin ? '' : (b.self_enroll?`<button class="btn" data-bsignup="${b.id}" style="margin-top:10px">Sign up</button>`:`<span class="small-link">🔒 Enrollment by administrator</span>`);
      return `<a class="p-card" href="learning.html?bundle=${b.id}">${cover}<h3>📦 ${esc(b.title)} ${b.visibility!=='published'&&isAdmin?`<span class="badge admin">${esc(b.visibility)}</span>`:''}</h3><p>${esc(b.description||'')}</p><span class="small-link">${(bmap[b.id]||[]).length} course(s)</span>${action?'<div>'+action+'</div>':''}</a>`;
    };

    root.innerHTML=`<div class="p-head"><h1>Courses</h1><p>Your NNCC education library.${isAdmin?' <a href="authoring.html">Open the course builder →</a>':''}</p></div>
      ${listB.length?`<h2 style="margin:6px 0 12px">Bundles</h2><div class="card-grid" style="margin-bottom:26px">${listB.map(bundleCard).join('')}</div>`:''}
      ${listB.length?'<h2 style="margin:6px 0 12px">Courses</h2>':''}
      <div class="card-grid">${listC.map(courseCard).join('')
        || '<div class="empty">'+(isAdmin?'No courses yet. <a href="authoring.html">Create one →</a>':'You are not enrolled in any courses yet.')+'</div>'}</div>`;

    root.querySelectorAll("[data-signup]").forEach(b=>b.addEventListener("click", async (e)=>{ e.preventDefault();
      const { error }=await sb.rpc("self_enroll",{ p_course:b.dataset.signup }); if(error) return alert(error.message); showCourses(); }));
    root.querySelectorAll("[data-bsignup]").forEach(b=>b.addEventListener("click", async (e)=>{ e.preventDefault(); e.stopPropagation();
      const { error }=await sb.rpc("self_enroll_bundle",{ p_bundle:b.dataset.bsignup }); if(error) return alert(error.message); showCourses(); }));
  }

  async function showBundle(bid){
    const { data:b } = await sb.from("bundles").select("*").eq("id",bid).single();
    if(!b){ root.innerHTML='<div class="empty">Bundle not found. <a href="learning.html">All courses</a></div>'; return; }
    const { data:bcs } = await sb.from("bundle_courses").select("course_id").eq("bundle_id",bid);
    const ids=(bcs||[]).map(x=>x.course_id);
    let courses=[]; if(ids.length){ const { data } = await sb.from("courses").select("*").in("id",ids); courses=data||[]; }
    const { data:benr } = await sb.from("bundle_enrollments").select("expires_at").eq("bundle_id",bid).eq("user_id",me.id);
    const isEnrolled = (benr||[]).some(active) || isAdmin;
    root.innerHTML=`<p class="crumbs"><a href="learning.html">← All courses</a></p>
      <div class="p-head"><h1>📦 ${esc(b.title)}</h1>${b.description?`<p>${esc(b.description)}</p>`:''}</div>
      ${!isEnrolled&&b.self_enroll?`<button class="btn" id="b-signup" style="margin-bottom:16px">Sign up for this bundle</button>`:''}
      ${!isEnrolled&&!b.self_enroll?`<div class="msg info">Enrollment in this bundle is managed by your program administrator.</div>`:''}
      <div class="card-grid">${courses.map(c=>`<a class="p-card" href="learning.html?course=${c.id}">
        ${c.cover_url?`<img src="${esc(c.cover_url)}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:''}
        <h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p></a>`).join('')||'<div class="empty">No courses in this bundle yet.</div>'}</div>`;
    const bs=$("#b-signup"); if(bs) bs.addEventListener("click", async ()=>{ const { error }=await sb.rpc("self_enroll_bundle",{ p_bundle:bid }); if(error) return alert(error.message); showBundle(bid); });
  }

  // ---------- Course detail ----------
  async function showCourse(cid){
    const { data:course } = await sb.from("courses").select("*").eq("id",cid).single();
    if(!course){ root.innerHTML='<div class="empty">Course not found. <a href="learning.html">All courses</a></div>'; return; }

    // prerequisite gate
    if(course.prerequisite_course_id && !isAdmin){
      const { data:preCert } = await sb.from("certificates").select("id").eq("course_id",course.prerequisite_course_id).eq("user_id",me.id).maybeSingle();
      if(!preCert){ const { data:pre }=await sb.from("courses").select("title").eq("id",course.prerequisite_course_id).single();
        root.innerHTML=`<p class="crumbs"><a href="learning.html">← All courses</a></p><div class="p-head"><h1>${esc(course.title)}</h1></div>
          <div class="msg info">🔒 This course requires you to complete <b>${esc(pre?pre.title:'a prerequisite course')}</b> first. <a href="learning.html?course=${course.prerequisite_course_id}">Go to it →</a></div>`; return; }
    }

    const { data:chs } = await sb.from("modules").select("*").eq("course_id",cid).order("sort_order").order("created_at");
    const ids=(chs||[]).map(c=>c.id);
    let les=[]; if(ids.length){ const { data } = await sb.from("lessons").select("*").in("module_id",ids).order("sort_order").order("created_at"); les=data||[]; }
    const done=await myDone();
    const byMod={}; les.forEach(l=>{(byMod[l.module_id]=byMod[l.module_id]||[]).push(l);});
    // drip: unlock date = my enrollment date + chapter.drip_days
    const { data:enr } = await sb.from("course_enrollments").select("enrolled_at").eq("course_id",cid).eq("user_id",me.id).maybeSingle();
    const start = enr ? new Date(enr.enrolled_at) : null;
    const unlockDate=(ch)=>{ if(isAdmin||!ch.drip_days||!start) return null; const d=new Date(start); d.setDate(d.getDate()+ch.drip_days); return d>new Date()?d:null; };

    // completion + certificate
    const total=les.length, dn=les.filter(l=>done.has(l.id)).length;
    let certBtn="";
    if(total>0 && dn===total && course.certificate_enabled!==false){
      await sb.rpc("claim_certificate",{ p_course:cid }).catch(()=>{});
      certBtn=`<a class="btn" href="certificate.html?course=${cid}" style="margin-bottom:16px">🎓 View your certificate</a>`;
    }

    root.innerHTML=`<p class="crumbs"><a href="learning.html">← All courses</a></p>
      <div class="p-head"><h1>${esc(course.title)}</h1>${course.description?`<p>${esc(course.description)}</p>`:''}
      ${isAdmin?`<p class="small-link"><a href="authoring.html">✎ Edit this course in the builder</a></p>`:''}</div>
      ${total>0?`<div class="prog" style="max-width:320px"><i style="width:${Math.round(dn/total*100)}%"></i></div><p class="small-link">${dn}/${total} lessons · ${Math.round(dn/total*100)}%</p>`:''}
      ${certBtn}
      ${(chs||[]).map(ch=>{ const ls=byMod[ch.id]||[]; const ud=unlockDate(ch);
        return `<div class="panel"><h2>${esc(ch.title)} ${ud?`<span class="badge member">🔒 unlocks ${ud.toLocaleDateString()}</span>`:''}</h2>
          <ul class="lesson-list">${ls.length? ls.map(l=> ud
              ? `<li><span style="display:flex;justify-content:space-between;padding:12px 4px;color:var(--muted)"><span>${PM.badge(l.lesson_type)}${esc(l.title)}</span><span>🔒</span></span></li>`
              : `<li><a href="learning.html?lesson=${l.id}&course=${cid}"><span>${PM.badge(l.lesson_type)}${esc(l.title)}</span><span>${done.has(l.id)?'✓':'›'}</span></a></li>`).join('')
            : '<li><span class="small-link" style="display:block;padding:12px 4px">No lessons yet.</span></li>'}</ul></div>`;
      }).join('') || '<div class="empty">No chapters yet.</div>'}`;
  }

  // ---------- Lesson ----------
  async function showLesson(id){
    const { data:l } = await sb.from("lessons").select("*").eq("id",id).single();
    if(!l){ root.innerHTML='<div class="empty">Lesson not found. <a href="learning.html">All courses</a></div>'; return; }
    const { data:ch } = await sb.from("modules").select("*").eq("id",l.module_id).single();
    const cid = (ch&&ch.course_id)||qs.get("course");
    let courseTitle=""; if(cid){ const { data:c }=await sb.from("courses").select("title").eq("id",cid).single(); courseTitle=c?c.title:""; }

    root.innerHTML=`<p class="crumbs"><a href="learning.html">Courses</a> ${cid?`› <a href="learning.html?course=${cid}">${esc(courseTitle)}</a>`:''} ${ch?`› ${esc(ch.title)}`:''}</p>
      <div class="p-head"><h1 style="margin:0">${esc(l.title)}</h1></div>
      <div class="lesson-body" id="lv-body" style="margin-top:16px">${lessonBody(l)}</div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="complete-btn">Mark as complete</button>
        ${cid?`<a class="btn outline" href="learning.html?course=${cid}">Back to course</a>`:''}
        ${isAdmin?`<a class="btn outline" href="authoring.html">✎ Edit in builder</a>`:''}
      </div>`;

    const { data:done } = await sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id).eq("lesson_id",id).maybeSingle();
    const btn=$("#complete-btn");
    const setState=(c)=>{ btn.textContent=c?"✓ Completed":"Mark as complete"; btn.classList.toggle("outline",c); btn.dataset.done=c?"1":""; };
    setState(!!done);
    btn.addEventListener("click", async ()=>{
      if(btn.dataset.done){ await sb.from("lesson_progress").delete().eq("user_id",me.id).eq("lesson_id",id); setState(false); }
      else { await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:id }); setState(true);
        if(cid) sb.rpc("claim_certificate",{ p_course:cid }).catch(()=>{}); }
    });

    // interactive engines
    const host=$("#lv-body");
    if(l.lesson_type==='quiz') renderQuiz(l.id, host, ()=>setState(true));
    else if(l.lesson_type==='assignment') renderAssignment(l.id, host, ()=>setState(true));
    else if(l.lesson_type==='survey') renderFeedback(l.id, cid, host, ()=>setState(true));
  }

  // Body for a lesson (quiz/assignment show only instructions here; the
  // interactive part is appended separately).
  function lessonBody(l){
    const t=l.lesson_type;
    if(t==='quiz'||t==='assignment'||t==='survey'){
      let h="";
      if(l.caption) h+=`<p style="color:var(--muted)">${esc(l.caption)}</p>`;
      if(l.content) h+=`<div class="lesson-text">${l.content}</div>`;
      if(l.external_url) h+=`<p style="margin-top:12px"><a class="btn outline" href="${esc(l.external_url)}" target="_blank" rel="noopener">Open link ↗</a></p>`;
      return h;
    }
    return PM.render(l,{admin:isAdmin});
  }

  // ---------- Quiz player ----------
  async function renderQuiz(lessonId, host, onPass){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:qs, error } = await sb.rpc("get_quiz",{ p_lesson:lessonId });
    if(error){ wrap.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
    const questions=qs||[];
    if(!questions.length){ wrap.innerHTML='<p class="small-link">This quiz has no questions yet.</p>'; return; }
    const { data:att } = await sb.from("quiz_attempts").select("score,total,passed,created_at").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const best=(att||[]).reduce((b,a)=>(a.total&&(!b||a.score/a.total>b.score/b.total))?a:b,null);
    wrap.innerHTML=`<div class="panel"><form id="quiz-form">
      ${questions.map(qBlock).join("")}
      <button class="btn" type="submit">Submit quiz</button></form>
      <div id="quiz-result" style="margin-top:14px">${best?`<span class="small-link">Best score so far: ${best.score}/${best.total}${best.passed?' · ✓ passed':''}</span>`:''}</div></div>`;
    wrap.querySelector("#quiz-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const answers={}; questions.forEach(q=>{ answers[q.id]=[...wrap.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(x=>x.value); });
      const { data:res, error } = await sb.rpc("grade_quiz",{ p_lesson:lessonId, p_answers:answers });
      if(error){ wrap.querySelector("#quiz-result").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      wrap.querySelector("#quiz-result").innerHTML=`<div class="msg ${res.passed?'ok':'err'}">Score: ${res.score}/${res.total}, ${res.passed?'Passed ✓':'Not yet passed (70% needed)'}</div>`;
      (res.results||[]).forEach(r=>{ const fb=wrap.querySelector(`.q[data-qid="${r.id}"] .q-fb`); if(fb) fb.innerHTML=`<span style="color:${r.correct?'#0c7373':'#8a1f1f'};font-weight:600;font-size:13px">${r.correct?'✓ Correct':'✗ Incorrect'}</span>${r.explanation?` <span class="small-link">${esc(r.explanation)}</span>`:''}`; });
      if(res.passed){ await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onPass)onPass(); }
    });
  }
  function qBlock(q,i){
    const opts=q.qtype==='tf'?[{id:'t',text:'True'},{id:'f',text:'False'}]:(q.options||[]);
    const inp=q.qtype==='multi'?'checkbox':'radio';
    const img=q.image_url?`<div style="margin:8px 0"><img src="${esc(q.image_url)}" alt="Question figure" loading="lazy" style="max-width:100%;border:1px solid var(--line,#d8dee6);border-radius:8px" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'small-link',textContent:'📷 Figure, view the original on Thinkific (image could not load here)'}))"></div>`:'';
    return `<div class="q" data-qid="${q.id}" style="margin-bottom:18px">
      <b>${i+1}. ${esc(q.question)}</b>${q.qtype==='multi'?' <span class="small-link">(select all that apply)</span>':''}
      ${img}
      <div style="margin-top:6px">${opts.map(o=>`<label style="display:block;margin:5px 0"><input type="${inp}" name="q-${q.id}" value="${esc(o.id)}"> ${esc(o.text)}</label>`).join("")}</div>
      <div class="q-fb" style="margin-top:4px"></div></div>`;
  }

  // ---------- Assignment submission ----------
  async function renderAssignment(lessonId, host, onSubmit){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:subs } = await sb.from("assignment_submissions").select("*").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const last=(subs||[])[0];
    wrap.innerHTML=`<div class="panel">
      <h3 style="margin:0 0 8px">Your submission</h3>
      ${last?`<div class="msg ${last.status==='graded'?'ok':'info'}">Status: ${esc(last.status)}${last.grade?` · Grade: <b>${esc(last.grade)}</b>`:''}</div>${last.feedback?`<p><b>Feedback:</b> ${esc(last.feedback)}</p>`:''}`:''}
      <form id="asg-form">
        <div class="field"><label>Your answer / notes</label><textarea id="asg-body" rows="4">${last?esc(last.body||''):''}</textarea></div>
        <div class="field"><label>Attach a file (optional)</label><input type="file" id="asg-file"></div>
        <div id="asg-msg"></div>
        <button class="btn" type="submit">${last?'Submit again':'Submit assignment'}</button>
      </form></div>`;
    wrap.querySelector("#asg-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const body=wrap.querySelector("#asg-body").value.trim()||null;
      const file=wrap.querySelector("#asg-file").files[0];
      const msg=wrap.querySelector("#asg-msg"); let file_path=null;
      if(file){ const safe=file.name.replace(/[^\w.\-]+/g,'_'); file_path=`${me.id}/${lessonId}/${Date.now()}-${safe}`;
        msg.innerHTML='<span class="small-link">Uploading…</span>';
        const { error:ue }=await sb.storage.from("submissions").upload(file_path,file,{upsert:true});
        if(ue){ msg.innerHTML=`<div class="msg err">${esc(ue.message)}</div>`; return; } }
      const { error }=await sb.from("assignment_submissions").insert({ lesson_id:lessonId, user_id:me.id, body, file_path });
      if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onSubmit)onSubmit();
      msg.innerHTML='<div class="msg ok">Submitted ✓</div>'; setTimeout(()=>showLesson(lessonId),900);
    });
  }

  // ---------- Course / module evaluation (native feedback form) ----------
  async function renderFeedback(lessonId, courseId, host, onDone){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:prev } = await sb.from("lesson_feedback").select("id,created_at").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const done=(prev||[])[0];
    wrap.innerHTML=`<div class="panel">
      <h3 style="margin:0 0 4px">Your feedback</h3>
      <p class="small-link" style="margin:0 0 12px">This short evaluation is anonymous to other learners and helps us improve the program.</p>
      ${done?`<div class="msg ok">Thank you — your feedback was recorded on ${new Date(done.created_at).toLocaleDateString()}. You may submit again below.</div>`:''}
      <form id="fb-form">
        <div class="field"><label>Overall, how would you rate this course/module?</label>
          <div id="fb-stars" style="font-size:26px;letter-spacing:4px;cursor:pointer;color:#c8932f">
            ${[1,2,3,4,5].map(n=>`<span data-n="${n}" style="opacity:.35">★</span>`).join("")}
          </div><input type="hidden" id="fb-rating" value=""></div>
        <div class="field"><label>Would you recommend it to a colleague?</label>
          <label style="display:inline-block;margin-right:16px"><input type="radio" name="fb-rec" value="yes"> Yes</label>
          <label style="display:inline-block"><input type="radio" name="fb-rec" value="no"> No</label></div>
        <div class="field"><label>What was most useful?</label><textarea id="fb-useful" rows="3"></textarea></div>
        <div class="field"><label>Suggestions for improvement (optional)</label><textarea id="fb-sugg" rows="3"></textarea></div>
        <div id="fb-msg"></div>
        <button class="btn" type="submit">Submit feedback</button>
      </form></div>`.replace('${0}','evaluation');
    const stars=[...wrap.querySelectorAll("#fb-stars span")];
    const paint=(v)=>stars.forEach(s=>s.style.opacity=(+s.dataset.n<=v)?'1':'.35');
    stars.forEach(s=>{ s.addEventListener("mouseenter",()=>paint(+s.dataset.n));
      s.addEventListener("click",()=>{ wrap.querySelector("#fb-rating").value=s.dataset.n; paint(+s.dataset.n); }); });
    wrap.querySelector("#fb-stars").addEventListener("mouseleave",()=>paint(+wrap.querySelector("#fb-rating").value||0));
    wrap.querySelector("#fb-form").addEventListener("submit", async (e)=>{
      e.preventDefault(); const msg=wrap.querySelector("#fb-msg");
      const rating=parseInt(wrap.querySelector("#fb-rating").value,10)||null;
      const recEl=wrap.querySelector('input[name="fb-rec"]:checked');
      if(!rating){ msg.innerHTML='<div class="msg err">Please choose a star rating.</div>'; return; }
      const { error }=await sb.from("lesson_feedback").insert({ lesson_id:lessonId, course_id:courseId||null, user_id:me.id,
        rating, recommend: recEl?recEl.value==='yes':null,
        most_useful: wrap.querySelector("#fb-useful").value.trim()||null,
        suggestions: wrap.querySelector("#fb-sugg").value.trim()||null });
      if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onDone)onDone();
      msg.innerHTML='<div class="msg ok">Thank you for your feedback ✓</div>';
    });
  }
})();
</script>
