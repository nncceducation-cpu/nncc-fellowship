<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses — Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .prog { height:7px;border-radius:999px;background:var(--navy-50);overflow:hidden;margin-top:10px }
  .prog > i { display:block;height:100%;background:var(--teal) }
  .lesson-text img{max-width:100%;border-radius:8px} .lesson-text h1,.lesson-text h2,.lesson-text h3{font-family:var(--font-serif);color:var(--navy)}
  .embed-wrap iframe{max-width:100%}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumbs a{color:var(--muted)}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="portal.html">
      <span class="mark">NNCC</span>
      <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>Courses</span></span>
    </a>
    <nav class="nav">
      <a href="portal.html">Portal</a>
      <a href="learning.html" class="active">Courses</a>
      <a href="forum.html">Forum</a>
      <span class="user-chip" id="user-chip"></span>
    </nav>
  </div>
</header>

<main class="portal-wrap">
  <div class="container narrow" id="root"></div>
</main>

<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal-auth.js"></script>
<script src="portal-media.js"></script>
<script>
(async function () {
  const me = await NNCC.requireAuth(); if(!me) return;
  const prof = await NNCC.profile();
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb = NNCC.client, PM = window.PortalMedia;
  const $=(s)=>document.querySelector(s), esc=PM.esc, root=$("#root");
  const isAdmin = prof.role==="admin";
  const qs=new URLSearchParams(location.search);
  const courseId=qs.get("course"), lessonId=qs.get("lesson");

  if(lessonId) showLesson(lessonId);
  else if(courseId) showCourse(courseId);
  else showCourses();

  async function myDone(){ const { data } = await sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id); return new Set((data||[]).map(p=>p.lesson_id)); }

  // ---------- Course catalog ----------
  async function showCourses(){
    const { data:courses } = await sb.from("courses").select("*").order("sort_order").order("created_at");
    const list=(courses||[]).filter(c=>c.published || isAdmin);
    const { data:mods } = await sb.from("modules").select("id,course_id");
    const { data:les } = await sb.from("lessons").select("id,module_id");
    const done=await myDone();
    const modByCourse={}, lesByMod={};
    (mods||[]).forEach(m=>{(modByCourse[m.course_id]=modByCourse[m.course_id]||[]).push(m.id);});
    (les||[]).forEach(l=>{(lesByMod[l.module_id]=lesByMod[l.module_id]||[]).push(l.id);});
    function courseStats(cid){ const mids=modByCourse[cid]||[]; let total=0,dn=0; mids.forEach(mid=>{(lesByMod[mid]||[]).forEach(lid=>{total++; if(done.has(lid))dn++;});}); return {total,dn}; }

    root.innerHTML=`<div class="p-head"><h1>Courses</h1><p>Your NNCC education library.${isAdmin?' <a href="authoring.html">Open the course builder →</a>':''}</p></div>
      <div class="card-grid">${list.map(c=>{ const s=courseStats(c.id); const pct=s.total?Math.round(s.dn/s.total*100):0;
        return `<a class="p-card" href="learning.html?course=${c.id}">
          <h3>${esc(c.title)}${c.published?'':' <span class="badge admin">draft</span>'}</h3>
          <p>${esc(c.description||'')}</p>
          <div class="prog"><i style="width:${pct}%"></i></div>
          <span class="small-link">${s.dn}/${s.total} lessons · ${pct}%</span></a>`;}).join('')
        || '<div class="empty">'+(isAdmin?'No courses yet. <a href="authoring.html">Create one →</a>':'You are not enrolled in any courses yet. Your program administrator can enroll you.')+'</div>'}</div>`;
  }

  // ---------- Course detail ----------
  async function showCourse(cid){
    const { data:course } = await sb.from("courses").select("*").eq("id",cid).single();
    if(!course){ root.innerHTML='<div class="empty">Course not found. <a href="learning.html">All courses</a></div>'; return; }
    const { data:chs } = await sb.from("modules").select("*").eq("course_id",cid).order("sort_order").order("created_at");
    const ids=(chs||[]).map(c=>c.id);
    let les=[]; if(ids.length){ const { data } = await sb.from("lessons").select("*").in("module_id",ids).order("sort_order").order("created_at"); les=data||[]; }
    const done=await myDone();
    const byMod={}; les.forEach(l=>{(byMod[l.module_id]=byMod[l.module_id]||[]).push(l);});
    root.innerHTML=`<p class="crumbs"><a href="learning.html">← All courses</a></p>
      <div class="p-head"><h1>${esc(course.title)}</h1>${course.description?`<p>${esc(course.description)}</p>`:''}
      ${isAdmin?`<p class="small-link"><a href="authoring.html">✎ Edit this course in the builder</a></p>`:''}</div>
      ${(chs||[]).map(ch=>{ const ls=byMod[ch.id]||[];
        return `<div class="panel"><h2>${esc(ch.title)}</h2>
          <ul class="lesson-list">${ls.length? ls.map(l=>`<li><a href="learning.html?lesson=${l.id}&course=${cid}">
            <span>${PM.badge(l.lesson_type)}${esc(l.title)}</span><span>${done.has(l.id)?'✓':'›'}</span></a></li>`).join('')
            : '<li><span class="small-link" style="display:block;padding:12px 4px">No lessons yet.</span></li>'}</ul></div>`;
      }).join('') || '<div class="empty">No chapters yet.</div>'}`;
  }

  // ---------- Lesson ----------
  async function showLesson(id){
    const { data:l } = await sb.from("lessons").select("*").eq("id",id).single();
    if(!l){ root.innerHTML='<div class="empty">Lesson not found. <a href="learning.html">All courses</a></div>'; return; }
    const { data:ch } = await sb.from("modules").select("*").eq("id",l.module_id).single();
    const cid = (ch&&ch.course_id)||qs.get("course");
    let courseTitle=""; if(cid){ const { data:c }=await sb.from("courses").select("title").eq("id",cid).single(); courseTitle=c?c.title:""; }

    root.innerHTML=`<p class="crumbs"><a href="learning.html">Courses</a> ${cid?`› <a href="learning.html?course=${cid}">${esc(courseTitle)}</a>`:''} ${ch?`› ${esc(ch.title)}`:''}</p>
      <div class="p-head"><h1 style="margin:0">${esc(l.title)}</h1></div>
      <div class="lesson-body" id="lv-body" style="margin-top:16px">${lessonBody(l)}</div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="complete-btn">Mark as complete</button>
        ${cid?`<a class="btn outline" href="learning.html?course=${cid}">Back to course</a>`:''}
        ${isAdmin?`<a class="btn outline" href="authoring.html">✎ Edit in builder</a>`:''}
      </div>`;

    const { data:done } = await sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id).eq("lesson_id",id).maybeSingle();
    const btn=$("#complete-btn");
    const setState=(c)=>{ btn.textContent=c?"✓ Completed":"Mark as complete"; btn.classList.toggle("outline",c); btn.dataset.done=c?"1":""; };
    setState(!!done);
    btn.addEventListener("click", async ()=>{
      if(btn.dataset.done){ await sb.from("lesson_progress").delete().eq("user_id",me.id).eq("lesson_id",id); setState(false); }
      else { await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:id }); setState(true); }
    });

    // interactive engines
    const host=$("#lv-body");
    if(l.lesson_type==='quiz') renderQuiz(l.id, host, ()=>setState(true));
    else if(l.lesson_type==='assignment') renderAssignment(l.id, host, ()=>setState(true));
  }

  // Body for a lesson (quiz/assignment show only instructions here; the
  // interactive part is appended separately).
  function lessonBody(l){
    const t=l.lesson_type;
    if(t==='quiz'||t==='assignment'){
      let h="";
      if(l.caption) h+=`<p style="color:var(--muted)">${esc(l.caption)}</p>`;
      if(l.content) h+=`<div class="lesson-text">${l.content}</div>`;
      if(l.external_url) h+=`<p style="margin-top:12px"><a class="btn outline" href="${esc(l.external_url)}" target="_blank" rel="noopener">Open link ↗</a></p>`;
      return h;
    }
    return PM.render(l,{admin:isAdmin});
  }

  // ---------- Quiz player ----------
  async function renderQuiz(lessonId, host, onPass){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:qs, error } = await sb.rpc("get_quiz",{ p_lesson:lessonId });
    if(error){ wrap.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
    const questions=qs||[];
    if(!questions.length){ wrap.innerHTML='<p class="small-link">This quiz has no questions yet.</p>'; return; }
    const { data:att } = await sb.from("quiz_attempts").select("score,total,passed,created_at").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const best=(att||[]).reduce((b,a)=>(a.total&&(!b||a.score/a.total>b.score/b.total))?a:b,null);
    wrap.innerHTML=`<div class="panel"><form id="quiz-form">
      ${questions.map(qBlock).join("")}
      <button class="btn" type="submit">Submit quiz</button></form>
      <div id="quiz-result" style="margin-top:14px">${best?`<span class="small-link">Best score so far: ${best.score}/${best.total}${best.passed?' · ✓ passed':''}</span>`:''}</div></div>`;
    wrap.querySelector("#quiz-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const answers={}; questions.forEach(q=>{ answers[q.id]=[...wrap.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(x=>x.value); });
      const { data:res, error } = await sb.rpc("grade_quiz",{ p_lesson:lessonId, p_answers:answers });
      if(error){ wrap.querySelector("#quiz-result").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      wrap.querySelector("#quiz-result").innerHTML=`<div class="msg ${res.passed?'ok':'err'}">Score: ${res.score}/${res.total} — ${res.passed?'Passed ✓':'Not yet passed (70% needed)'}</div>`;
      (res.results||[]).forEach(r=>{ const fb=wrap.querySelector(`.q[data-qid="${r.id}"] .q-fb`); if(fb) fb.innerHTML=`<span style="color:${r.correct?'#0c7373':'#8a1f1f'};font-weight:600;font-size:13px">${r.correct?'✓ Correct':'✗ Incorrect'}</span>${r.explanation?` <span class="small-link">${esc(r.explanation)}</span>`:''}`; });
      if(res.passed){ await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onPass)onPass(); }
    });
  }
  function qBlock(q,i){
    const opts=q.qtype==='tf'?[{id:'t',text:'True'},{id:'f',text:'False'}]:(q.options||[]);
    const inp=q.qtype==='multi'?'checkbox':'radio';
    return `<div class="q" data-qid="${q.id}" style="margin-bottom:18px">
      <b>${i+1}. ${esc(q.question)}</b>${q.qtype==='multi'?' <span class="small-link">(select all that apply)</span>':''}
      <div style="margin-top:6px">${opts.map(o=>`<label style="display:block;margin:5px 0"><input type="${inp}" name="q-${q.id}" value="${esc(o.id)}"> ${esc(o.text)}</label>`).join("")}</div>
      <div class="q-fb" style="margin-top:4px"></div></div>`;
  }

  // ---------- Assignment submission ----------
  async function renderAssignment(lessonId, host, onSubmit){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:subs } = await sb.from("assignment_submissions").select("*").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const last=(subs||[])[0];
    wrap.innerHTML=`<div class="panel">
      <h3 style="margin:0 0 8px">Your submission</h3>
      ${last?`<div class="msg ${last.status==='graded'?'ok':'info'}">Status: ${esc(last.status)}${last.grade?` · Grade: <b>${esc(last.grade)}</b>`:''}</div>${last.feedback?`<p><b>Feedback:</b> ${esc(last.feedback)}</p>`:''}`:''}
      <form id="asg-form">
        <div class="field"><label>Your answer / notes</label><textarea id="asg-body" rows="4">${last?esc(last.body||''):''}</textarea></div>
        <div class="field"><label>Attach a file (optional)</label><input type="file" id="asg-file"></div>
        <div id="asg-msg"></div>
        <button class="btn" type="submit">${last?'Submit again':'Submit assignment'}</button>
      </form></div>`;
    wrap.querySelector("#asg-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const body=wrap.querySelector("#asg-body").value.trim()||null;
      const file=wrap.querySelector("#asg-file").files[0];
      const msg=wrap.querySelector("#asg-msg"); let file_path=null;
      if(file){ const safe=file.name.replace(/[^\w.\-]+/g,'_'); file_path=`${me.id}/${lessonId}/${Date.now()}-${safe}`;
        msg.innerHTML='<span class="small-link">Uploading…</span>';
        const { error:ue }=await sb.storage.from("submissions").upload(file_path,file,{upsert:true});
        if(ue){ msg.innerHTML=`<div class="msg err">${esc(ue.message)}</div>`; return; } }
      const { error }=await sb.from("assignment_submissions").insert({ lesson_id:lessonId, user_id:me.id, body, file_path });
      if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onSubmit)onSubmit();
      msg.innerHTML='<div class="msg ok">Submitted ✓</div>'; setTimeout(()=>showLesson(lessonId),900);
    });
  }
})();
</script>
</body>
</html>
