<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses, Harvey Sarnat NNCC Fellowship</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css?v=6d84165">
  <link rel="stylesheet" href="portal-mobile.css">
  <script src="app-boot.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .prog { height:7px;border-radius:999px;background:var(--navy-50);overflow:hidden;margin-top:10px }
  .prog > i { display:block;height:100%;background:var(--teal) }
  .lesson-text img{max-width:100%;border-radius:8px}
  .lesson-text h1,.lesson-text h2,.lesson-text h3{font-family:var(--font-serif);color:var(--navy)}
  .lesson-text{line-height:1.65}
  .lesson-text ul,.lesson-text ol{margin:10px 0;padding-left:26px}
  .lesson-text blockquote{border-left:3px solid var(--teal);margin:12px 0;padding:2px 0 2px 14px;color:var(--muted)}
  .lesson-text a{color:var(--teal-600)}
  .lesson-text .ql-align-center{text-align:center}
  .lesson-text .ql-align-right{text-align:right}
  .lesson-text .ql-align-justify{text-align:justify}
  .lesson-text .ql-indent-1{padding-left:3em}.lesson-text .ql-indent-2{padding-left:6em}
  .lesson-text .ql-indent-3{padding-left:9em}.lesson-text .ql-indent-4{padding-left:12em}
  .embed-wrap iframe{max-width:100%}
  .quiz-rich{line-height:1.55}
  .quiz-rich>p:first-child{margin-top:0}.quiz-rich>p:last-child{margin-bottom:0}
  .quiz-rich img,.quiz-rich video,.quiz-rich audio{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:8px}
  .quiz-rich iframe{display:block;width:min(100%,720px);aspect-ratio:16/9;height:auto;min-height:240px;margin:10px 0;border:0;border-radius:8px}
  .quiz-shell{padding:0!important;overflow:visible;background:transparent!important;border:0!important;box-shadow:none!important}
  .quiz-overview{position:sticky;top:12px;z-index:6;margin-bottom:22px;padding:18px 20px;border:1px solid #d9e5e8;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 10px 30px rgba(15,42,61,.09);backdrop-filter:blur(10px)}
  .quiz-overview-row{display:flex;align-items:center;justify-content:space-between;gap:18px}
  .quiz-eyebrow{display:block;margin-bottom:3px;color:var(--teal-600,#0c7373);font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
  .quiz-overview h2{margin:0;color:var(--navy,#12344d);font-size:20px}
  .quiz-overview p{margin:4px 0 0;color:var(--muted,#637381);font-size:13px}
  .quiz-count{flex:0 0 auto;min-width:94px;padding:10px 14px;border-radius:12px;background:#eef8f7;color:var(--navy,#12344d);text-align:center;font-size:12px;font-weight:700}
  .quiz-count strong{display:block;color:var(--teal-600,#0c7373);font-size:22px;line-height:1}
  .quiz-track{height:7px;margin-top:14px;overflow:hidden;border-radius:99px;background:#e8eef1}
  .quiz-track i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal,#159b91),#54c5bc);transition:width .25s ease}
  .quiz-list{display:grid;gap:20px}
  .course-section{padding:0!important;overflow:hidden}.course-section summary{display:flex;align-items:center;gap:10px;padding:18px 20px;cursor:pointer;list-style:none}.course-section summary::-webkit-details-marker{display:none}.course-section summary h2{margin:0;font-size:19px}.course-section summary .chapter-meta{margin-left:auto;color:var(--muted);font-size:12px}.course-section summary::after{content:'⌄';margin-left:7px;color:var(--teal);font-weight:900}.course-section[open] summary::after{transform:rotate(180deg)}.course-section .lesson-list{margin:0;padding:0 20px 12px;border-top:1px solid var(--line)}
  .lesson-progress-head{position:sticky;top:8px;z-index:8;padding:12px 15px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.96);box-shadow:0 8px 22px rgba(15,42,61,.08);backdrop-filter:blur(8px)}.lesson-progress-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.lesson-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:18px}.lesson-nav .next{text-align:right}.lesson-nav a{min-height:46px}.lesson-nav-label{display:block;color:var(--muted);font-size:11px}
  .quiz-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.quiz-tools label{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}.quiz-tools select{width:auto;padding:8px 30px 8px 9px}.quiz-nav{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 18px}.quiz-nav button{position:relative;width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;font-weight:700}.quiz-nav button.answered{border-color:var(--teal);background:#edf9f7}.quiz-nav button.bookmarked::after{content:'★';position:absolute;right:-3px;top:-7px;color:#d18a00;font-size:10px}.q-bookmark{position:absolute;right:14px;top:14px;border:0;background:transparent;color:#8a9aa2;font-size:20px;cursor:pointer}.q-bookmark.active{color:#d18a00}
  .q{position:relative;padding:22px;border:1px solid #dce5e9;border-radius:18px;background:#fff;box-shadow:0 5px 18px rgba(15,42,61,.055);transition:border-color .2s,box-shadow .2s,transform .2s}
  .q:hover{border-color:#bed3d8;box-shadow:0 9px 24px rgba(15,42,61,.08)}
  .q.is-answered{border-color:#9fd3ce}
  .q.needs-answer{border-color:#d39a50;box-shadow:0 0 0 3px rgba(211,154,80,.14)}
  .q.is-correct{border-color:#69b9a7;background:linear-gradient(180deg,#fff 0,#f4fbf9 100%)}
  .q.is-incorrect{border-color:#d8a0a0;background:linear-gradient(180deg,#fff 0,#fff8f8 100%)}
  .q-head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;margin-bottom:16px}
  .q-number{display:grid;width:42px;height:42px;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--navy,#12344d),#28566e);color:#fff;font-weight:800;box-shadow:0 5px 12px rgba(18,52,77,.18)}
  .q-prompt{min-width:0;color:#183746;font-size:16px;font-weight:600;line-height:1.62}
  .q-prompt .quiz-rich>p{margin:0 0 10px}
  .q-instruction{display:inline-flex;margin-top:8px;padding:4px 9px;border-radius:999px;background:#eef5f7;color:#506a77;font-size:11px;font-weight:700}
  .quiz-options{display:grid;gap:10px;margin-left:56px}
  .quiz-choice{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;margin:0;padding:13px 15px;border:1.5px solid #dce5e9;border-radius:13px;background:#fbfcfd;color:#294956;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s,transform .16s}
  .quiz-choice:hover{transform:translateY(-1px);border-color:#8ebeb9;background:#f5fbfa;box-shadow:0 5px 13px rgba(15,99,94,.08)}
  .quiz-choice.is-selected{border-color:var(--teal,#159b91);background:#edf9f7;box-shadow:0 0 0 2px rgba(21,155,145,.1)}
  .quiz-choice input{appearance:none;-webkit-appearance:none;display:grid;width:22px;height:22px;place-content:center;margin:1px 0 0;border:2px solid #91a6af;background:#fff;cursor:pointer;transition:.16s}
  .quiz-choice input[type="radio"]{border-radius:50%}
  .quiz-choice input[type="checkbox"]{border-radius:6px}
  .quiz-choice input::before{content:"";width:10px;height:10px;transform:scale(0);transition:transform .12s ease;background:#fff}
  .quiz-choice input[type="radio"]::before{border-radius:50%;box-shadow:inset 1em 1em #fff}
  .quiz-choice input[type="checkbox"]::before{width:5px;height:9px;margin-top:-2px;border:solid #fff;border-width:0 2px 2px 0;background:transparent;transform:rotate(45deg) scale(0)}
  .quiz-choice input:checked{border-color:var(--teal,#159b91);background:var(--teal,#159b91)}
  .quiz-choice input:checked::before{transform:scale(1)}
  .quiz-choice input[type="checkbox"]:checked::before{transform:rotate(45deg) scale(1)}
  .quiz-choice input:focus-visible{outline:3px solid rgba(21,155,145,.25);outline-offset:3px}
  .choice-content{min-width:0;line-height:1.55}
  .choice-content .quiz-rich>p{margin:0}
  .q-fb{display:none;margin:16px 0 0 56px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.55}
  .q-fb:not(:empty){display:block}
  .q.is-correct .q-fb{background:#e8f7f2;color:#176650}
  .q.is-incorrect .q-fb{background:#fff0f0;color:#863838}
  .q-fb-title{display:block;margin-bottom:5px;font-weight:800}
  .quiz-submit-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px;padding:16px 18px;border:1px solid #d9e5e8;border-radius:15px;background:#fff;box-shadow:0 8px 24px rgba(15,42,61,.08)}
  .quiz-submit-note{color:var(--muted,#637381);font-size:13px}
  .quiz-submit{min-width:170px;font-weight:800}
  .quiz-submit[disabled]{cursor:wait;opacity:.72}
  .quiz-result{margin-top:16px}
  .quiz-result-card{display:flex;align-items:center;gap:15px;padding:18px;border-radius:15px;border:1px solid}
  .quiz-result-card.ok{border-color:#88cbbd;background:#edf9f6;color:#155d4b}
  .quiz-result-card.err{border-color:#dfaaaa;background:#fff4f4;color:#7f3333}
  .quiz-score{display:grid;flex:0 0 auto;width:58px;height:58px;place-items:center;border-radius:50%;background:#fff;font-size:18px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .quiz-result-card strong{display:block;margin-bottom:3px;font-size:17px}
  @media(max-width:700px){
    .quiz-overview{position:static;padding:16px}.quiz-overview-row{align-items:flex-start}.quiz-count{min-width:78px}
    .q{padding:17px}.q-head{grid-template-columns:36px minmax(0,1fr);gap:11px}.q-number{width:36px;height:36px;border-radius:10px}
    .quiz-options,.q-fb{margin-left:0}.quiz-choice{grid-template-columns:22px minmax(0,1fr);padding:12px}
    .quiz-submit-bar{align-items:stretch;flex-direction:column}.quiz-submit{width:100%}
    .quiz-rich iframe{min-height:190px}
    .lesson-nav{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:12;grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 -7px 24px rgba(15,42,61,.12)}.lesson-nav>a{display:flex;align-items:center;justify-content:center}.lesson-nav>.lesson-back{display:none}
  }
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumbs a{color:var(--muted)}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="portal.html">
      <img class="mark" src="logo-nncc.png" alt="NNCC" style="border-radius:50%;object-fit:cover;background:none;padding:0">
      <span class="brand-text"><b>Harvey Sarnat NNCC Fellowship</b><span>Courses</span></span>
    </a>
    <nav class="nav">
      <a href="portal.html">Portal</a>
      <a href="learning.html" class="active">Courses</a>
      <a href="forum.html">Forum</a>
      <span class="user-chip" id="user-chip"></span>
    </nav>
  </div>
</header>

<main class="portal-wrap">
  <div class="container narrow" id="root"></div>
</main>

<script src="portal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal-auth.js"></script>
<script src="portal-shell.js"></script>
<script src="portal-media.js"></script>
<script>
(async function () {
  const me = await NNCC.requireAccess("modules"); if(!me) return;
  const prof = await NNCC.profile();
  NNCC.mountUserChip(document.getElementById("user-chip"));
  const sb = NNCC.client, PM = window.PortalMedia;
  const $=(s)=>document.querySelector(s), esc=PM.esc, root=$("#root");
  const isAdmin = prof.role==="admin";
  const qs=new URLSearchParams(location.search);
  const courseId=qs.get("course"), lessonId=qs.get("lesson"), bundleId=qs.get("bundle");

  if(lessonId) showLesson(lessonId);
  else if(courseId) showCourse(courseId);
  else if(bundleId) showBundle(bundleId);
  else showCourses();

  async function myDone(){ const { data } = await sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id); return new Set((data||[]).map(p=>p.lesson_id)); }

  // ---------- Course catalog ----------
  const active=(e)=> (!e.starts_at || new Date(e.starts_at) <= new Date()) && (!e.expires_at || new Date(e.expires_at) > new Date());
  async function showCourses(){
    const [{data:courses},{data:mods},{data:les},{data:enr},{data:bundles},{data:bcs},{data:benr},{data:reqs}] = await Promise.all([
      sb.from("courses").select("*").order("sort_order").order("created_at"),
      sb.from("modules").select("id,course_id"),
      sb.from("lessons").select("id,module_id"),
      sb.from("course_enrollments").select("course_id,starts_at,expires_at").eq("user_id",me.id),
      sb.from("bundles").select("*").order("sort_order").order("created_at"),
      sb.from("bundle_courses").select("*"),
      sb.from("bundle_enrollments").select("bundle_id,expires_at").eq("user_id",me.id),
      sb.from("course_access_requests").select("course_id,status").eq("user_id",me.id),
    ]);
    const done=await myDone();
    const modByCourse={}, lesByMod={};
    (mods||[]).forEach(m=>{(modByCourse[m.course_id]=modByCourse[m.course_id]||[]).push(m.id);});
    (les||[]).forEach(l=>{(lesByMod[l.module_id]=lesByMod[l.module_id]||[]).push(l.id);});
    const stats=(cid)=>{ let t=0,d=0; (modByCourse[cid]||[]).forEach(mid=>(lesByMod[mid]||[]).forEach(lid=>{t++; if(done.has(lid))d++;})); return {t,d}; };
    const enrolled=new Set((enr||[]).filter(active).map(e=>e.course_id));
    const benrolled=new Set((benr||[]).filter(active).map(e=>e.bundle_id));
    const bmap={}; (bcs||[]).forEach(x=>{(bmap[x.bundle_id]=bmap[x.bundle_id]||[]).push(x.course_id);});
    const granted=new Set(); benrolled.forEach(bid=>(bmap[bid]||[]).forEach(cid=>granted.add(cid)));
    const requested=new Map((reqs||[]).map(r=>[r.course_id,r.status]));
    const stateOf=(c)=> isAdmin||!c.enrollment_required ? 'open'
      : (enrolled.has(c.id)||granted.has(c.id)) ? 'enrolled'
      : c.self_enroll ? 'signup' : 'locked';

    const listC = isAdmin ? (courses||[]) : (courses||[]).filter(c=>c.visibility==='published');
    const listB = isAdmin ? (bundles||[]) : (bundles||[]).filter(b=>b.visibility==='published' && (bmap[b.id]||[]).length);

    const courseCard=(c)=>{ const s=stats(c.id); const pct=s.t?Math.round(s.d/s.t*100):0; const st=stateOf(c);
      const cover=c.cover_url?`<img src="${esc(c.cover_url)}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:'';
      const badges=`${c.visibility!=='published'&&isAdmin?`<span class="badge admin">${esc(c.visibility)}</span> `:''}`;
      const clickable = (st==='open'||st==='enrolled');
      const statusLabel=pct===100?'Completed':pct>0?'In progress':st==='locked'?'Locked':'Not started';
      const cme=(c.description||'').match(/\b(\d+(?:\.\d+)?)\s*CME hours?/i), estimate=s.t?Math.max(1,Math.round(s.t*8/60)):0;
      const action = st==='signup'
        ? `<button class="btn" data-signup="${c.id}" style="margin-top:10px">Enroll now</button>`
        : st==='locked' && requested.get(c.id)==='pending' ? `<button class="btn outline" disabled style="margin-top:10px">✓ Access requested</button><span class="small-link" style="display:block;margin-top:6px">Waiting for administrator approval</span>`
        : st==='locked' ? `<button class="btn outline" data-request-access="${c.id}" data-course-title="${esc(c.title)}" style="margin-top:10px">Request access</button>`
        : `<div class="prog"><i style="width:${pct}%"></i></div><span class="small-link">${s.d}/${s.t} lessons · ${pct}%</span><span class="course-open-label">${pct?'Continue course':'Start course'} →</span>`;
      const inner=`${cover}<div class="course-card-status"><span class="badge member">${statusLabel}</span>${cme?`<span>${cme[1]} CME hours</span>`:''}${estimate?`<span>≈ ${estimate} h</span>`:''}</div><h3 title="${esc(c.title)}">${esc(c.title)} ${badges}</h3><p>${esc(c.description||'')}</p>${action}`;
      const state=pct===100?'complete':pct>0?'progress':'not-started';
      return clickable ? `<a class="p-card course-catalog-card" data-title="${esc((c.title+' '+(c.description||'')).toLowerCase())}" data-progress="${state}" href="learning.html?course=${c.id}">${inner}</a>`
        : `<div class="p-card course-catalog-card" data-title="${esc((c.title+' '+(c.description||'')).toLowerCase())}" data-progress="${state}" style="cursor:default">${inner}</div>`;
    };
    const bundleCard=(b)=>{ const enrolledB=benrolled.has(b.id); const cover=b.cover_url?`<img src="${esc(b.cover_url)}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">`:'';
      const action = enrolledB||isAdmin ? '' : (b.self_enroll?`<button class="btn" data-bsignup="${b.id}" style="margin-top:10px">Sign up</button>`:`<span class="small-link">🔒 Enrollment by administrator</span>`);
      return `<a class="p-card" href="learning.html?bundle=${b.id}">${cover}<h3>📦 ${esc(b.title)} ${b.visibility!=='published'&&isAdmin?`<span class="badge admin">${esc(b.visibility)}</span>`:''}</h3><p>${esc(b.description||'')}</p><span class="small-link">${(bmap[b.id]||[]).length} course(s)</span>${action?'<div>'+action+'</div>':''}</a>`;
    };

    root.innerHTML=`<div class="p-head"><h1>Courses</h1><p>Your NNCC education library.${isAdmin?' <a href="authoring.html">Open the course builder →</a>':''}</p></div>
      ${listB.length?`<h2 style="margin:6px 0 12px">Bundles</h2><div class="card-grid" style="margin-bottom:26px">${listB.map(bundleCard).join('')}</div>`:''}
      ${listB.length?'<h2 style="margin:6px 0 12px">NNCC courses</h2>':''}
      <div class="catalog-tools" role="search"><label class="catalog-search"><span>Search courses</span><input id="course-search" type="search" placeholder="Search by module or topic…" autocomplete="off"></label><div class="catalog-filters" aria-label="Filter courses"><button type="button" class="active" data-filter="all">All</button><button type="button" data-filter="not-started">Not started</button><button type="button" data-filter="progress">In progress</button><button type="button" data-filter="complete">Completed</button></div></div>
      <div class="card-grid" id="course-grid">${listC.filter(c=>!/\bAI in Medicine\b/i.test(c.title)).map(courseCard).join('')
        || '<div class="empty">'+(isAdmin?'No courses yet. <a href="authoring.html">Create one →</a>':'You are not enrolled in any courses yet.')+'</div>'}</div>`;
    const aiCourses=listC.filter(c=>/\bAI in Medicine\b/i.test(c.title)); if(aiCourses.length)$("#course-grid").insertAdjacentHTML("afterend",`<h2 class="catalog-section-title">Additional learning</h2><div class="card-grid" id="additional-course-grid">${aiCourses.map(courseCard).join('')}</div>`);

    const search=$("#course-search"), filterButtons=[...root.querySelectorAll("[data-filter]")];
    let filter="all";
    const applyCatalogFilter=()=>{
      const term=(search?.value||"").trim().toLowerCase(); let shown=0;
      root.querySelectorAll(".course-catalog-card").forEach(card=>{
        const matchesText=!term||(card.dataset.title||"").includes(term);
        const matchesState=filter==="all"||card.dataset.progress===filter;
        const visible=matchesText&&matchesState;
        card.hidden=!visible;
        card.style.display=visible?"":"none";
        if(visible)shown++;
      });
      let empty=$("#catalog-empty");
      if(!empty){ empty=document.createElement("div"); empty.id="catalog-empty"; empty.className="empty"; $("#course-grid")?.after(empty); }
      empty.textContent=shown?"":"No courses match this search and filter.";
      empty.style.display=shown?"none":"block";
    };
    search?.addEventListener("input",applyCatalogFilter);
    filterButtons.forEach(btn=>btn.addEventListener("click",()=>{ filter=btn.dataset.filter; filterButtons.forEach(b=>b.classList.toggle("active",b===btn)); applyCatalogFilter(); }));

    root.querySelectorAll("[data-signup]").forEach(b=>b.addEventListener("click", async (e)=>{ e.preventDefault();
      const { error }=await sb.rpc("self_enroll",{ p_course:b.dataset.signup }); if(error) return alert(error.message); showCourses(); }));
    root.querySelectorAll("[data-request-access]").forEach(b=>b.addEventListener("click", async (e)=>{ e.preventDefault(); e.stopPropagation();
      const note=prompt(`Request access to ${b.dataset.courseTitle}\n\nOptional: tell the administrator why you would like to take this course.`,"");
      if(note===null) return;
      b.disabled=true; b.textContent="Sending request…";
      const { error }=await sb.rpc("request_course_access",{p_course:b.dataset.requestAccess,p_message:note.trim()||null});
      if(error){ b.disabled=false; b.textContent="Request access"; return alert(error.message); }
      alert("Your access request was sent. You can start the course after an administrator approves it.");
      showCourses();
    }));
    root.querySelectorAll("[data-bsignup]").forEach(b=>b.addEventListener("click", async (e)=>{ e.preventDefault(); e.stopPropagation();
      const { error }=await sb.rpc("self_enroll_bundle",{ p_bundle:b.dataset.bsignup }); if(error) return alert(error.message); showCourses(); }));
  }

  async function showBundle(bid){
    const { data:b } = await sb.from("bundles").select("*").eq("id",bid).single();

  async function renderQuiz(lessonId, host, onPass){
    const wrap=document.createElement("div"); host.appendChild(wrap);

    if(error){ wrap.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
    const questions=qs||[];
    if(!questions.length){ wrap.innerHTML='<p class="small-link">This quiz has no questions yet.</p>'; return; }
    const { data:att } = await sb.from("quiz_attempts").select("score,total,passed,created_at").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const best=(att||[]).reduce((b,a)=>(a.total&&(!b||a.score/a.total>b.score/b.total))?a:b,null);
    wrap.innerHTML=`<div class="panel quiz-shell">
      <div class="quiz-overview">
        <div class="quiz-overview-row"><div><span class="quiz-eyebrow">Knowledge check</span><h2>Work at your own pace</h2><p>${best?`Best score: ${best.score}/${best.total}${best.passed?' · Passed ✓':''}`:'Choose the best answer for every question.'}</p></div>
        <div class="quiz-count"><strong id="quiz-answered">0</strong> of ${questions.length}<span> answered</span></div></div>
        <div class="quiz-track" aria-hidden="true"><i id="quiz-progress"></i></div>
      </div>
      <div class="quiz-tools"><label>Quiz mode <select id="quiz-mode"><option value="practice">Practice all questions</option><option value="bookmarked">Bookmarked questions</option><option value="incorrect" disabled>Review incorrect after submission</option></select></label><span class="small-link">Use the numbered navigator to jump between questions.</span></div>
      <nav class="quiz-nav" id="quiz-nav" aria-label="Question navigator">${questions.map((q,i)=>`<button type="button" data-jump="${q.id}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</nav>
      <form id="quiz-form" novalidate><div class="quiz-list">${questions.map(qBlock).join("")}</div>
        <div class="quiz-submit-bar"><span class="quiz-submit-note" id="quiz-submit-note">${questions.length} questions remaining</span><button class="btn quiz-submit" type="submit">Submit answers</button></div>
      </form>
      <div id="quiz-result" class="quiz-result" aria-live="polite"></div></div>`;
    const form=wrap.querySelector("#quiz-form"), submit=form.querySelector(".quiz-submit"), bookmarkKey=`nncc-quiz-bookmarks-${lessonId}`; let bookmarks=new Set(JSON.parse(localStorage.getItem(bookmarkKey)||"[]")), incorrect=new Set();
    const syncBookmarks=()=>{wrap.querySelectorAll(".q").forEach(card=>{const yes=bookmarks.has(card.dataset.qid);card.querySelector(".q-bookmark")?.classList.toggle("active",yes);card.querySelector(".q-bookmark")?.setAttribute("aria-pressed",String(yes));wrap.querySelector(`[data-jump="${card.dataset.qid}"]`)?.classList.toggle("bookmarked",yes);});};
    wrap.querySelector("#quiz-nav").addEventListener("click",e=>{const b=e.target.closest("[data-jump]");if(b)wrap.querySelector(`.q[data-qid="${b.dataset.jump}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});});
    wrap.querySelector(".quiz-list").addEventListener("click",e=>{const b=e.target.closest(".q-bookmark");if(!b)return;const id=b.closest(".q").dataset.qid;bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);localStorage.setItem(bookmarkKey,JSON.stringify([...bookmarks]));syncBookmarks();});
    wrap.querySelector("#quiz-mode").addEventListener("change",e=>{const mode=e.target.value;wrap.querySelectorAll(".q").forEach(card=>card.hidden=mode==='bookmarked'?!bookmarks.has(card.dataset.qid):mode==='incorrect'?!incorrect.has(card.dataset.qid):false);});
    const updateProgress=()=>{
      let answered=0;
      questions.forEach(q=>{
        const card=wrap.querySelector(`.q[data-qid="${q.id}"]`);
        const selected=[...card.querySelectorAll("input:checked")];
        card.classList.toggle("is-answered",selected.length>0);
        card.classList.remove("needs-answer");
        card.querySelectorAll(".quiz-choice").forEach(choice=>choice.classList.toggle("is-selected",choice.querySelector("input").checked));
        wrap.querySelector(`[data-jump="${q.id}"]`)?.classList.toggle("answered",selected.length>0);
        if(selected.length) answered++;
      });
      const remaining=questions.length-answered;
      wrap.querySelector("#quiz-answered").textContent=answered;
      wrap.querySelector("#quiz-progress").style.width=`${Math.round(answered/questions.length*100)}%`;
      wrap.querySelector("#quiz-submit-note").textContent=remaining?`${remaining} question${remaining===1?'':'s'} remaining`:'All questions answered — ready to submit';
    };
    form.addEventListener("change",updateProgress);
    updateProgress(); syncBookmarks();
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const unanswered=questions.filter(q=>!wrap.querySelector(`input[name="q-${q.id}"]:checked`));
      if(unanswered.length){
        unanswered.forEach(q=>wrap.querySelector(`.q[data-qid="${q.id}"]`).classList.add("needs-answer"));
        wrap.querySelector("#quiz-result").innerHTML=`<div class="msg info">Please answer the ${unanswered.length} highlighted question${unanswered.length===1?'':'s'} before submitting.</div>`;
        wrap.querySelector(`.q[data-qid="${unanswered[0].id}"]`).scrollIntoView({behavior:"smooth",block:"center"});
        return;
      }
      submit.disabled=true; submit.textContent="Checking answers…";
      const answers={}; questions.forEach(q=>{ answers[q.id]=[...wrap.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(x=>x.value); });
      const { data:res, error } = await sb.rpc("grade_quiz",{ p_lesson:lessonId, p_answers:answers });
      submit.disabled=false; submit.textContent="Submit answers";
      if(error){ wrap.querySelector("#quiz-result").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      const outcome=res.pass_required===false?'Completed ✓':res.passed?'Passed ✓':`Not yet passed (${res.pass_percent||70}% needed)`;
      const success=res.pass_required===false||res.passed, pct=res.total?Math.round(res.score/res.total*100):0;
      wrap.querySelector("#quiz-result").innerHTML=`<div class="quiz-result-card ${success?'ok':'err'}"><div class="quiz-score">${pct}%</div><div><strong>${outcome}</strong><span>Score: ${res.score} of ${res.total}. Review the feedback below, then try again whenever you are ready.</span></div></div>`;
      (res.results||[]).forEach(r=>{
        const card=wrap.querySelector(`.q[data-qid="${r.id}"]`), fb=card?.querySelector(".q-fb");
        if(!card||!fb)return;
        card.classList.remove("is-correct","is-incorrect"); card.classList.add(r.correct?"is-correct":"is-incorrect");
        if(!r.correct)incorrect.add(r.id);
        const explanation=r.explanation_html?`<div class="quiz-rich">${quizRich(r.explanation_html,r.explanation)}</div>`:r.explanation?`<div>${esc(r.explanation)}</div>`:'';
        fb.innerHTML=`<span class="q-fb-title">${r.correct?'✓ Correct':'✕ Not quite'}</span>${explanation}`;
      });
      wrap.querySelector("#quiz-result").scrollIntoView({behavior:"smooth",block:"center"});
      if(incorrect.size){const opt=wrap.querySelector("#quiz-mode").querySelector('option[value="incorrect"]');opt.disabled=false;opt.textContent=`Review ${incorrect.size} incorrect question${incorrect.size===1?'':'s'}`;}
      if(res.passed){ await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onPass)onPass(); }
    });
  }

  // Keep curriculum modules in their clinical sequence even when bundle rows were added at different times.
  function courseOrder(a,b){
    const rank=(c)=>{
      const t=(c.title||"").toLowerCase();
      const m=t.match(/\bmodule\s*(\d+)\b/);
      if(m) return Number(m[1]);
      if(t.includes("nursing")) return 50;
      if(t.includes("imaging")) return 51;
      if(t.includes("question bank")) return 52;
      return 90 + Number(c.sort_order||0);
    };
    return rank(a)-rank(b) || Number(a.sort_order||0)-Number(b.sort_order||0) || (a.title||"").localeCompare(b.title||"");
  }
  function quizRich(html,fallback){
    const tpl=document.createElement("template");
    tpl.innerHTML=html||esc(fallback||"");
    const allowed=new Set(["P","BR","B","STRONG","I","EM","U","S","SUB","SUP","UL","OL","LI","BLOCKQUOTE","H1","H2","H3","H4","SPAN","DIV","FIGURE","FIGCAPTION","IMG","VIDEO","AUDIO","SOURCE","IFRAME","A"]);
    const safeUrl=(v)=>{ try{ const u=new URL(v,location.href); return ["https:","http:"].includes(u.protocol)?u.href:""; }catch(_){ return ""; } };
    [...tpl.content.querySelectorAll("*")].forEach(el=>{
      if(!allowed.has(el.tagName)){ el.replaceWith(...el.childNodes); return; }
      [...el.attributes].forEach(a=>{
        if(!["src","href","alt","title","width","height","controls","playsinline","preload","poster","target","rel","allow","allowfullscreen"].includes(a.name)) el.removeAttribute(a.name);
      });
      if(el.hasAttribute("src")){ const u=safeUrl(el.getAttribute("src")); if(u)el.setAttribute("src",u); else el.removeAttribute("src"); }
      if(el.hasAttribute("href")){ const u=safeUrl(el.getAttribute("href")); if(u){el.setAttribute("href",u);el.setAttribute("target","_blank");el.setAttribute("rel","noopener");}else el.removeAttribute("href"); }
      if(el.tagName==="VIDEO"||el.tagName==="AUDIO"){ el.setAttribute("controls",""); el.setAttribute("preload","metadata"); }
      if(el.tagName==="IFRAME"){ el.setAttribute("loading","lazy"); el.setAttribute("allowfullscreen",""); }
    });
    return tpl.innerHTML;
  }
  function qBlock(q,i){
    const opts=q.qtype==='tf'?[{id:'t',text:'True'},{id:'f',text:'False'}]:(q.options||[]);
    const inp=q.qtype==='multi'?'checkbox':'radio';
    const hasRichMedia=/<(?:img|video|audio|iframe)\b/i.test(q.question_html||'');
    const img=q.image_url&&!hasRichMedia?`<div class="q-media"><img src="${esc(q.image_url)}" alt="Question figure" loading="lazy" style="max-width:100%;border:1px solid var(--line,#d8dee6);border-radius:10px" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'small-link',textContent:'Question media could not be loaded.'}))"></div>`:'';
    return `<section class="q" data-qid="${q.id}"><button type="button" class="q-bookmark" aria-label="Bookmark question ${i+1}" aria-pressed="false">★</button>
      <div class="q-head"><span class="q-number" aria-hidden="true">${i+1}</span><div class="q-prompt"><div class="quiz-rich">${quizRich(q.question_html,q.question)}</div>${q.qtype==='multi'?'<span class="q-instruction">Select all that apply</span>':''}</div></div>
      ${img}
      <div class="quiz-options">${opts.map(o=>`<label class="quiz-choice"><input type="${inp}" name="q-${q.id}" value="${esc(o.id)}"><span class="choice-content quiz-rich">${quizRich(o.html,o.text)}</span></label>`).join("")}</div>
      <div class="q-fb"></div></section>`;
  }

  // ---------- Assignment submission ----------
  async function renderAssignment(lessonId, host, onSubmit){

    const { data:subs } = await sb.from("assignment_submissions").select("*").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const last=(subs||[])[0];

      <form id="asg-form">
        <div class="field"><label>Your answer / notes</label><textarea id="asg-body" rows="4">${last?esc(last.body||''):''}</textarea></div>
        <div class="field"><label>Attach a file (optional)</label><input type="file" id="asg-file"></div>
        <div id="asg-msg"></div>
        <button class="btn" type="submit">${last?'Submit again':'Submit assignment'}</button>
      </form></div>`;
    wrap.querySelector("#asg-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const body=wrap.querySelector("#asg-body").value.trim()||null;
      const file=wrap.querySelector("#asg-file").files[0];
      const msg=wrap.querySelector("#asg-msg"); let file_path=null;
      const btn=e.submitter;
      if(!body&&!file){ msg.innerHTML='<div class="msg err">Add an answer or attach a file before submitting.</div>'; return; }
      btn.disabled=true; btn.textContent="Submitting…";
      if(file){ const safe=file.name.replace(/[^\w.\-]+/g,'_'); file_path=`${me.id}/${lessonId}/${Date.now()}-${safe}`;
        msg.innerHTML='<span class="small-link">Uploading…</span>';
        const { error:ue }=await sb.storage.from("submissions").upload(file_path,file,{upsert:true});
        if(ue){ msg.innerHTML=`<div class="msg err">${esc(ue.message)}</div>`; btn.disabled=false; btn.textContent=last?'Submit again':'Submit assignment'; return; } }
      const { error }=await sb.from("assignment_submissions").insert({ lesson_id:lessonId, user_id:me.id, body, file_path });
      if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; btn.disabled=false; btn.textContent=last?'Submit again':'Submit assignment'; return; }
      await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onSubmit)onSubmit();
      msg.innerHTML='<div class="msg ok">Submitted ✓</div>'; setTimeout(()=>showLesson(lessonId),900);
    });
  }

  // ---------- Course / module evaluation (native feedback form) ----------
  async function renderFeedback(lessonId, courseId, host, onDone){
    const wrap=document.createElement("div"); host.appendChild(wrap);
    const { data:prev } = await sb.from("lesson_feedback").select("id,created_at").eq("lesson_id",lessonId).eq("user_id",me.id).order("created_at",{ascending:false});
    const done=(prev||[])[0];
    wrap.innerHTML=`<div class="panel">
      <h3 style="margin:0 0 4px">Your feedback</h3>
      <p class="small-link" style="margin:0 0 12px">This short evaluation is anonymous to other learners and helps us improve the program.</p>
      ${done?`<div class="msg ok">Thank you — your feedback was recorded on ${new Date(done.created_at).toLocaleDateString()}. You may submit again below.</div>`:''}
      <form id="fb-form">
        <div class="field"><label>Overall, how would you rate this course/module?</label>
          <div id="fb-stars" style="font-size:26px;letter-spacing:4px;cursor:pointer;color:#c8932f">
            ${[1,2,3,4,5].map(n=>`<span data-n="${n}" style="opacity:.35">★</span>`).join("")}
          </div><input type="hidden" id="fb-rating" value=""></div>
        <div class="field"><label>Would you recommend it to a colleague?</label>
          <label style="display:inline-block;margin-right:16px"><input type="radio" name="fb-rec" value="yes"> Yes</label>
          <label style="display:inline-block"><input type="radio" name="fb-rec" value="no"> No</label></div>
        <div class="field"><label>What was most useful?</label><textarea id="fb-useful" rows="3"></textarea></div>
        <div class="field"><label>Suggestions for improvement (optional)</label><textarea id="fb-sugg" rows="3"></textarea></div>
        <div id="fb-msg"></div>
        <button class="btn" type="submit">Submit feedback</button>
      </form></div>`.replace('${0}','evaluation');
    const stars=[...wrap.querySelectorAll("#fb-stars span")];
    const paint=(v)=>stars.forEach(s=>s.style.opacity=(+s.dataset.n<=v)?'1':'.35');
    stars.forEach(s=>{ s.addEventListener("mouseenter",()=>paint(+s.dataset.n));
      s.addEventListener("click",()=>{ wrap.querySelector("#fb-rating").value=s.dataset.n; paint(+s.dataset.n); }); });
    wrap.querySelector("#fb-stars").addEventListener("mouseleave",()=>paint(+wrap.querySelector("#fb-rating").value||0));
    wrap.querySelector("#fb-form").addEventListener("submit", async (e)=>{
      e.preventDefault(); const msg=wrap.querySelector("#fb-msg");
      const rating=parseInt(wrap.querySelector("#fb-rating").value,10)||null;
      const recEl=wrap.querySelector('input[name="fb-rec"]:checked');
      if(!rating){ msg.innerHTML='<div class="msg err">Please choose a star rating.</div>'; return; }
      const { error }=await sb.from("lesson_feedback").insert({ lesson_id:lessonId, course_id:courseId||null, user_id:me.id,
        rating, recommend: recEl?recEl.value==='yes':null,
        most_useful: wrap.querySelector("#fb-useful").value.trim()||null,
        suggestions: wrap.querySelector("#fb-sugg").value.trim()||null });
      if(error){ msg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      await sb.from("lesson_progress").upsert({ user_id:me.id, lesson_id:lessonId }); if(onDone)onDone();
      msg.innerHTML='<div class="msg ok">Thank you for your feedback ✓</div>';
    });
  }
})();
</script>
