<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NNCC Portal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c2a4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --navy:#0c2a4d; --navy2:#143a66; --teal:#0f8a8a;
    --ink:#13294a; --muted:#5b6b7b; --line:#e6eaf0; --mint:#e4f3ec;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--navy);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; min-height:100%;
    padding:env(safe-area-inset-top) 0 0;
  }
  .hero{
    color:#fff; text-align:center;
    padding:26px 20px 20px;
    font-size:28px; font-weight:800; letter-spacing:-.4px;
  }
  .sheet{
    background:#f4f7fb;
    border-radius:20px 20px 0 0;
    flex:1 0 auto;
    margin:0 auto; width:100%; max-width:520px;
    box-shadow:0 -6px 24px rgba(4,18,36,.18);
    overflow:hidden;
    padding-bottom:96px;
  }
  .brandbar{
    display:flex; align-items:center; gap:12px;
    background:#fff; padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .brandbar img{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
  .brandbar b{ font-size:18px; color:var(--navy); font-weight:700; }
  .list{ padding:20px 16px 8px; display:flex; flex-direction:column; gap:16px; }
  .tile{
    display:flex; align-items:center; gap:16px;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:18px 18px; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(12,42,77,.04);
    transition:transform .08s ease, box-shadow .12s ease;
  }
  .tile:active{ transform:scale(.99); box-shadow:0 1px 2px rgba(12,42,77,.04); }
  .dot{ width:46px; height:46px; border-radius:50%; background:var(--mint); flex:0 0 auto;
        display:flex; align-items:center; justify-content:center; }
  .dot svg{ width:22px; height:22px; stroke:var(--teal); fill:none; stroke-width:1.9;
            stroke-linecap:round; stroke-linejoin:round; }
  .tile h3{ margin:0 0 3px; font-size:17px; font-weight:700; color:var(--navy); }
  .tile p{ margin:0; font-size:14px; color:var(--muted); }

  /* Log in / sign up + website link */
  .cta{ padding:14px 16px 8px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .btn-login{ display:block; width:100%; text-align:center; background:var(--teal); color:#fff;
              font-weight:700; font-size:16px; padding:16px; border-radius:12px; text-decoration:none;
              box-shadow:0 4px 14px rgba(15,138,138,.28); }
  .btn-login:active{ transform:translateY(1px); }
  .web-link{ color:var(--muted); font-size:14px; font-weight:600; text-decoration:none; }
  .web-link:active{ color:var(--navy); }

  /* bottom tab bar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; background:#fff; border-top:1px solid var(--line);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
        text-decoration:none; color:#8a97a6; font-size:12px; font-weight:600; }
  .tab svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8;
            stroke-linecap:round; stroke-linejoin:round; }
  .tab.active{ color:var(--teal); }
</style>
</head>
<body>

  <div class="hero">Your courses &amp; progress</div>

  <main class="sheet">
    <div class="brandbar">
      <img src="logo-nncc.png" alt="NNCC">
      <b>NNCC Portal</b>
    </div>

    <div class="list">
      <a class="tile" href="login.html?next=learning.html">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H4zM2 19h20"/></svg></span>
        <span><h3>Education Modules</h3><p>Work through the NNCC curriculum</p></span>
      </a>
      <a class="tile" href="login.html?next=events.html">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14"/></svg></span>
        <span><h3>Coaching &amp; Webinars</h3><p>Live sessions with faculty</p></span>
      </a>
      <a class="tile" href="login.html?next=forum.html">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H8l-4 4z"/></svg></span>
        <span><h3>Members' Forum</h3><p>Ask questions, share cases</p></span>
      </a>
      <a class="tile" href="login.html?next=portal.html">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 21l-4.9-2.8.9-5.5-4-3.9 5.5-.8z"/></svg></span>
        <span><h3>My Certificates</h3><p>Download what you've earned</p></span>
      </a>
    </div>

    <div class="cta">
      <a class="btn-login" href="login.html">Log in / Sign up</a>
      <a class="web-link" href="https://sarnatnncc.ca" target="_blank" rel="noopener">Visit the full website ↗</a>
    </div>
  </main>

  <nav class="tabbar" aria-label="Primary">
    <a class="tab active" href="home.html">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a class="tab" href="login.html?next=learning.html">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H4zM2 19h20"/></svg>
      <span>Courses</span>
    </a>
    <a class="tab" href="login.html?next=events.html">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14"/></svg>
      <span>Webinars</span>
    </a>
    <a class="tab" href="login.html?next=forum.html">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v10H8l-4 4z"/></svg>
      <span>Forum</span>
    </a>
  </nav>

</body>
</html>
